<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- 背景（圆角方形，maskable 安全区） -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 怪异龙 icon 风格：龙角 + 面甲 -->
  <g stroke="url(#dg)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 左角 -->
    <path d="M168 196 C 150 150, 150 118, 172 84"/>
    <!-- 右角 -->
    <path d="M344 196 C 362 150, 362 118, 340 84"/>
    <!-- 头部轮廓 -->
    <path d="M172 200 C 172 160, 200 130, 256 130 C 312 130, 340 160, 340 200 L 340 260 C 340 320, 300 356, 256 356 C 212 356, 172 320, 172 260 Z"/>
    <!-- 眼 -->
    <path d="M206 236 L 244 236"/>
    <path d="M268 236 L 306 236"/>
  </g>

  <!-- 眼睛发光点 -->
  <circle cx="225" cy="236" r="10" fill="#58a6ff"/>
  <circle cx="287" cy="236" r="10" fill="#58a6ff"/>

  <!-- 嘴/牙 -->
  <path d="M226 306 L 256 330 L 286 306" fill="none" stroke="#3fb950" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部标签：序号计数器风格的小圆点 -->
  <circle cx="256" cy="432" r="12" fill="#d29922"/>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<!-- ===== PWA ===== -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="怪异任务">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>怪异任务编辑器</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --sub:#8b949e;
    --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; --line:#30363d;
    --dragon:#bc8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--fg);min-height:100vh;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:40px;
  }
  header{
    position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  /* 版本号：点击检查更新 */
  .ver{font-size:11px;color:var(--sub);background:#21262d;border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;cursor:pointer;user-select:none;flex:none}
  .ver:active{background:#2d333b}
  .ver.new{color:var(--ok);border-color:var(--ok)}
  .spacer{flex:1}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--sub);display:inline-block}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--err)}
  .stat{font-size:12px;color:var(--sub)}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  input,select,button{
    font-family:inherit;font-size:14px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);padding:9px 12px;outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:active{opacity:.7}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg)}
  button.warn{background:var(--warn)}
  button:disabled{opacity:.4;cursor:not-allowed}
  #search{flex:1;min-width:150px}
  .grid{display:grid;gap:12px}
  @media(min-width:640px){ .grid{grid-template-columns:1fr 1fr} }

  .q{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    cursor:pointer;transition:border-color .15s,transform .1s;position:relative;
  }
  .q:active{transform:scale(.99)}
  .q:hover{border-color:var(--accent)}
  /* 删除按钮（卡片右上角） */
  .q .del{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;
    background:transparent;border:1px solid transparent;color:var(--sub);
    font-size:15px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;
    z-index:2;cursor:pointer;
  }
  .q .del:hover{background:rgba(248,81,73,.15);border-color:var(--err);color:var(--err)}
  .q .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-right:34px}
  .q .no{font-weight:700;font-size:15px;color:var(--accent)}
  .q .idx{font-size:11px;color:var(--sub);background:#161b22;padding:2px 6px;border-radius:6px}
  .q .lv{font-size:12px;background:#21262d;padding:2px 8px;border-radius:20px;color:var(--sub)}
  .q .ty{font-size:12px;padding:2px 8px;border-radius:20px;margin-left:auto}
  .ty.hunt{background:rgba(63,185,80,.15);color:var(--ok)}
  .ty.slay{background:rgba(248,81,73,.15);color:var(--err)}
  .ty.other{background:rgba(210,153,34,.15);color:var(--warn)}
  .q .map{font-size:13px;color:var(--sub);margin-bottom:6px}
  .q .mons{display:flex;flex-wrap:wrap;gap:6px}
  .mon{font-size:12px;background:#21262d;border:1px solid var(--line);padding:2px 8px;border-radius:8px}
  .mon.inv{border-color:var(--warn);color:var(--warn)}
  /* 第一个怪：突出 */
  .mon.primary{background:rgba(88,166,255,.18);border-color:var(--accent);color:var(--accent);font-weight:700;font-size:13px}
  /* 目标内的其它怪：稍微突出（弱于第一个） */
  .mon.secondary{background:rgba(88,166,255,.08);border-color:#3d5a80;color:#a9c7e8}
  .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#21262d;color:var(--sub)}
  .tag.sp{background:rgba(188,140,255,.15);color:var(--dragon)}
  .tag.spc{background:rgba(63,185,80,.15);color:var(--ok)}
  .tag.lock{background:rgba(210,153,34,.15);color:var(--warn)}
  .tag.new{background:rgba(88,166,255,.15);color:var(--accent)}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;
    border-radius:18px 18px 0 0;padding:18px 18px 0;border:1px solid var(--line);
    animation:up .22s ease;
    -webkit-overflow-scrolling:touch;   /* iOS 顺滑滚动 */
  }
  @media(min-width:640px){ .overlay{align-items:center} .sheet{border-radius:18px} }
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h2{margin:0 0 4px;font-size:17px}
  .sheet .sub{color:var(--sub);font-size:12px;margin-bottom:14px}
  /* 普通一行（flex）：用于批量/设置等杂项行 */
  .frow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #21262d;flex-wrap:wrap}
  .frow>label{font-size:13px;color:var(--sub);min-width:70px}
  .frow input{font-size:13px;height:32px;box-sizing:border-box;padding:0 9px}
  .frow select{font-size:13px;height:32px;box-sizing:border-box;padding:0 9px}
  .frow .pick{width:auto;padding:0 10px;font-size:13px;background:#21262d;color:var(--accent);
    height:32px;box-sizing:border-box;line-height:1;
    border:1px solid var(--line);border-radius:8px;flex:none}
  .frow .nm{font-size:12px;color:var(--ok);min-width:70px;flex:none;line-height:32px}
  .frow .hintv{font-size:11px;color:var(--sub);flex:none;line-height:32px}

  /* 字段行（grid）：标签 / 输入框 / 📋 / 说明 —— 四列严格对齐 */
  .frow.f{display:grid;grid-template-columns:minmax(56px,1fr) 84px 40px minmax(92px,112px);
    gap:8px;align-items:center;flex-wrap:nowrap}
  .frow.f>label{font-size:13px;color:var(--sub);min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow.f input{width:100%;text-align:right;padding:0 9px}
  .frow.f .pick{width:100%;padding:0;font-size:14px}
  .frow.f .nobtn{display:block}          /* 无按钮时的占位 */
  /* 说明列：允许换行（不截断），行高自适应 */
  .frow.f .nm,.frow.f .hintv{
    white-space:normal;word-break:break-word;line-height:1.35;
    font-size:11px;align-self:center;min-width:0;
  }
  .frow.f .nm{color:var(--ok)}

  /* 弹窗底部按钮区：常驻在底部（内容再长也能随时点保存/取消） */
  .sheet-actions{
    position:sticky;bottom:0;z-index:5;
    margin:16px -18px 0;              /* 横向铺满（抵消 sheet 左右内边距） */
    padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));
    background:var(--card);
    border-top:1px solid var(--line);
    box-shadow:0 -8px 16px rgba(13,17,23,.85);   /* 向上投影，遮住滚过的内容 */
  }
  .frow .hintv{font-size:11px;color:var(--sub);min-width:56px;flex:none;text-align:left}
  .sec{font-size:12px;color:var(--accent);font-weight:700;margin:16px 0 4px;letter-spacing:1px}

  /* 筛选面板：可选小标签 */
  .fchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
  .fchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    background:#21262d;border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:13px;color:var(--fg);user-select:none}
  .fchip input{width:auto;height:auto;padding:0;margin:0;flex:none;
    accent-color:var(--accent)}
  .fchip:has(input:checked){background:rgba(88,166,255,.18);border-color:var(--accent);color:var(--accent)}
  .fnum{display:inline-flex;align-items:center;gap:6px;
    background:#21262d;border:1px solid var(--line);border-radius:10px;
    padding:4px 10px;font-size:12px;color:var(--sub)}
  .fnum input{width:74px;height:28px;padding:0 6px;font-size:13px;text-align:right;flex:none}
  .hint{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.6}
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:#21262d;border:1px solid var(--line);color:var(--fg);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;
    transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1}
  .loading{text-align:center;padding:60px 20px;color:var(--sub)}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);
        border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .picker{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;
    align-items:center;justify-content:center;padding:16px}
  .picker.show{display:flex}
  .picker .box{background:var(--card);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column}
  .picker .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .picker .hd b{font-size:15px}
  .picker .hd input{flex:1}
  .picker .items{overflow-y:auto;padding:8px}
  .picker .it{padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .picker .it:hover,.picker .it.on{background:#21262d}
  .picker .it .id{color:var(--sub);font-size:12px}

  /* 底部进度条（读取任务时显示） */
  .progressbar{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:rgba(22,27,34,.97);border-top:1px solid var(--accent);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:none;transition:transform .2s;
  }
  .progressbar.show{display:block}
  .progressbar .pbar-txt{font-size:12px;color:var(--fg);margin-bottom:6px;text-align:center}
  .progressbar .pbar-track{height:6px;background:#21262d;border-radius:4px;overflow:hidden}
  .progressbar .pbar-fill{height:100%;width:0;background:var(--accent);border-radius:4px;
    transition:width .15s linear}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1 id="titleEl" style="cursor:pointer">怪异任务<span>编辑器</span></h1>
  <span class="ver" id="verEl" title="点击检查更新">…</span>
  <span class="spacer"></span>
  <span class="stat" id="modeTag" style="font-size:11px;font-weight:700"></span>
  <span class="stat" id="seqStat" style="font-size:11px;cursor:pointer" title="点击修改「序号计数器」">🔢 …</span>
  <span class="stat" id="stat">未连接</span>
  <button class="ghost" id="cfgBtn" style="padding:5px 10px;font-size:12px">⚙️ 中转地址</button>
</header>

<!-- JS 自检标记：JS 执行后会隐藏它（若一直可见 = JS 没跑） -->
<div id="jsCheck" style="background:#f85149;color:#fff;padding:12px;text-align:center;font-size:14px">
  ⚠️ JavaScript 没有执行！<br>
  <span style="font-size:12px">这个页面需要 JS 才能工作。可能是浏览器禁用了 JS，或直接预览 HTML 时不运行脚本。<br>
  请改用浏览器打开：<b id="jsCheckUrl">（正在生成…）</b></span>
</div>

<div class="wrap">
  <div class="toolbar">
    <input id="search" placeholder="搜索：编号 / 怪物 / 地图…" />
    <button id="filterBtn" class="ghost">🔎 筛选<span id="filterDot" style="display:none"> ●</span></button>
    <select id="sort">
      <option value="序号-desc" selected>序号 ↓</option>
      <option value="序号-asc">序号 ↑</option>
      <option value="编号-asc">编号 ↑</option>
      <option value="编号-desc">编号 ↓</option>
      <option value="index-asc">内存顺序 ↑</option>
      <option value="index-desc">内存顺序 ↓</option>
    </select>
    <button id="addBtn">➕ 添加任务</button>
    <button id="batch" class="warn">⚡ 批量改任务</button>
    <button id="exportBtn" class="ghost">📤 导出文件</button>
    <button id="openBtn" class="ghost">📥 打开文件</button>
    <button id="writeBackBtn" class="ghost">⬆️ 上传到游戏</button>
    <button id="reload" class="ghost">🔄 读取游戏任务</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
  </div>
  <div id="list" class="grid"></div>
  <div id="loading" class="loading" style="display:none"></div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<div class="picker" id="picker"><div class="box">
  <div class="hd"><b id="pkTitle">选择</b><input id="pkSearch" inputmode="none" placeholder="搜索…" /></div>
  <div class="items" id="pkItems"></div>
</div></div>

<!-- 底部进度条 -->
<div class="progressbar" id="progressbar">
  <div class="pbar-txt">读取中…</div>
  <div class="pbar-track"><div class="pbar-fill"></div></div>
</div>

<div class="toast" id="toast"></div>

<!-- 逻辑全部在 js/ 里（按依赖顺序加载） -->
<!-- ===== data.js ===== -->

// ---------- 地图 ID 表 ----------
var MAPS = {

<script>
/* ============================================================
 * bridge.js —— 与中转服务的通信层（唯一和后端打交道的地方）
 * 中转只提供：GET /status、POST /cmd、POST /config
 * ============================================================ */

var Bridge = (function () {
  // 中转地址（固定默认：http://127.0.0.1:6001）
  //  优先级：localStorage 手动设置 > 默认 127.0.0.1:6001
  //  说明：网页可能由别的服务（如 8093）发出来，未必和中转同址，
  //        所以这里【不做自动探测】，默认就是 127.0.0.1:6001。
  var DEFAULT = 'http://127.0.0.1:6001';
  var base = localStorage.getItem('bridge') || DEFAULT;

  // 迁移：早期版本可能存过 8080 / localhost 等旧地址 → 自动升级到新默认值
  (function migrate() {
    if (!base) { base = DEFAULT; return; }
    // 只要端口不是 6001，且是"本机/回环"地址，就换成新默认值
    var m = base.match(/^https?:\/\/(127\.0\.0\.1|localhost|\[::1\])(?::(\d+))?/i);
    if (m && m[2] !== '6001') {
      base = DEFAULT;
      localStorage.setItem('bridge', base);
    }
  })();

  function url(path) {
    return base.replace(/\/+$/, '') + path;
  }

  /** 探活：返回 {ok, connected, ip, port} */
  async function status() {
    var r = await fetch(url('/status'));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }

  /** 发一条原始 sys-botbase 命令，返回回复文本（已 trim） */
  async function cmd(s) {
    var r = await fetch(url('/cmd'), { method: 'POST', body: s });
    var t = await r.text();
    if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
    return t.trim();
  }

  /** 修改 Switch 目标 */
  async function setTarget(ip, port) {
    var r = await fetch(url('/config'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip: ip, port: port })
    });
    return await r.json();
  }

  function getBase() { return base; }
  function setBase(v) { base = v; localStorage.setItem('bridge', v); }

  return {
    status: status,
    cmd: cmd,
    setTarget: setTarget,
    getBase: getBase,
    setBase: setBase
  };
})();
</script>

<script>
/* ============================================================
 * memory.js —— 内存底层操作（把 sys-botbase 命令封装成好用的函数）
 *
 * ⚠️ 三个必须处理的坑：
 *   1) sys-botbase 返回的 hex 是"高字节在前"，要用时需两两一组反转
 *   2) peek 的参数是"相对 heap 的偏移"，不能直接给绝对地址
 *   3) poke 的数据必须带 0x 前缀，否则会被当十进制解析（写坏数据！）
 * ============================================================ */

var Mem = (function () {
  var heapBase = null;
  var mainBase = null;

  // ---------- 基础工具 ----------

  /** hex 字符串 -> Uint8Array（按 sys-botbase 输出顺序，即高字节在前） */
  function hexToBytes(hex) {
    hex = (hex || '').replace(/\s/g, '');
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) {
      out[i] = parseInt(hex.substr(i * 2, 2), 16);
    }
    return out;
  }

  /** Uint8Array -> hex 字符串（大写） */
  function bytesToHex(arr) {
    var s = '';
    for (var i = 0; i < arr.length; i++) {
      s += (arr[i] < 16 ? '0' : '') + arr[i].toString(16).toUpperCase();
    }
    return s;
  }

  /**
   * 把 sys-botbase 返回的字节数组按"小端 64 位"解析成整数。
   * sys-botbase 返回的顺序是反的，例如 70F6C2D227000000 -> 0x27D2C2F670
   */
  function u64(bytes) {
    // bytes 高字节在前 => 反转成低字节在前（little endian）
    var v = 0n;
    for (var i = 0; i < 8; i++) {
      v |= BigInt(bytes[i]) << BigInt(8 * i);
    }
    return Number(v & 0xFFFFFFFFFFFFFn); // 48 位足够（Switch 地址）
  }

  /** 取 Uint8Array 里第 off 起的 little-endian uint32 */
  function u32(b, off) {
    return (b[off] | (b[off + 1] << 8) | (b[off + 2] << 16) | (b[off + 3] << 24)) >>> 0;
  }

  /** 把 uint32 写进 Uint8Array 的 off 处（little-endian） */
  function putU32(b, off, val) {
    b[off] = val & 0xFF;
    b[off + 1] = (val >>> 8) & 0xFF;
    b[off + 2] = (val >>> 16) & 0xFF;
    b[off + 3] = (val >>> 24) & 0xFF;
  }

  // ---------- 基址 ----------

  async function getHeapBase() {
    if (heapBase === null) {
      heapBase = parseInt(await Bridge.cmd('getHeapBase'), 16);
    }
    return heapBase;
  }
  async function getMainBase() {
    if (mainBase === null) {
      mainBase = parseInt(await Bridge.cmd('getMainNsoBase'), 16);
    }
    return mainBase;
  }
  function resetCache() { heapBase = null; mainBase = null; }

  // ---------- 读写 ----------

  /** 相对 heap 读 n 字节 -> Uint8Array */
  async function peekHeap(off, n) {
    var r = await Bridge.cmd('peek 0x' + off.toString(16).toUpperCase() + ' ' + n);
    return hexToBytes(r);
  }
/** 相对 NSO 读 n 字节 -> Uint8Array */
  async function peekMain(off, n) {
    var r = await Bridge.cmd('peekMain 0x' + off.toString(16).toUpperCase() + ' ' + n);
    return hexToBytes(r);
  }

  /** 相对 heap 写（off 是相对 heap 的偏移） */
  async function pokeHeap(off, data) {
    await Bridge.cmd('poke 0x' + off.toString(16).toUpperCase() + ' 0x' + bytesToHex(data));
  }

  /** 相对 NSO 写（off 是相对 main NSO 的偏移）—— 注意 poke 数据必须带 0x 前缀！ */
  async function pokeMain(off, data) {
    await Bridge.cmd('pokeMain 0x' + off.toString(16).toUpperCase() + ' 0x' + bytesToHex(data));
  }


  /** 按绝对地址读（自动判断 heap / NSO）
   *  ⚠️ peek 的参数是【相对 heap 的偏移】，peekMain 的参数是【相对 main NSO 的偏移】
   *     （源码里会各自 + heap_base / + main_nso_base），所以要减去对应 base。
   */
  async function readAbs(addr, n) {
    var hb = await getHeapBase();
    if (hb && addr >= hb && addr < hb + 0x40000000) {
      return await peekHeap(addr - hb, n);
    }
    var mb = await getMainBase();
    return await peekMain(addr - mb, n);
  }

  /** 按绝对地址写（data 是 Uint8Array）——自动补 0x 前缀！
   *  ⚠️ 注意：poke 的参数是【相对 heap 的偏移】，pokeMain 的参数是【相对 main NSO 的偏移】
   *     （源码里会各自 + heap_base / + main_nso_base），所以这里要减去对应 base。
   */
  async function writeAbs(addr, data) {
    var hb = await getHeapBase();
    var hexs = '0x' + bytesToHex(data);  // ⚠️ 必须带 0x！
    if (hb && addr >= hb && addr < hb + 0x40000000) {
      await Bridge.cmd('poke 0x' + (addr - hb).toString(16).toUpperCase() + ' ' + hexs);
    } else {
      var mb = await getMainBase();
      await Bridge.cmd('pokeMain 0x' + (addr - mb).toString(16).toUpperCase() + ' ' + hexs);
    }
  }

  // ---------- 大块读 / 写（提速核心）----------
  // sys-botbase 的 peek/poke 支持一次读/写很长（上限由 MAX_LINE_LENGTH=22016 决定）：
  //   · 读：一次最多输出 MAX_LINE_LENGTH 字节（hex 是 2 倍，但输出不受行限制）
  //   · 写：命令是 "poke <off> <hex>"，hex 占 2 字符/字节，所以单次数据 ≤ ~11000 字节
  // 自动按安全分块大小切分，把 200 次请求降到 1~3 次。
  var READ_CHUNK = 20000;    // 单次读字节数（< 22016 留余量）
  var WRITE_CHUNK = 8000;    // 单次写字节数（hex 16000 字符 < 22016 留余量）

  /** 大块读：从绝对地址 addr 读 n 字节（自动按 READ_CHUNK 分块），返回 Uint8Array */
  async function readRange(addr, n) {
    var hb = await getHeapBase();
    var out = new Uint8Array(n);
    var got = 0;
    while (got < n) {
      var thisLen = Math.min(READ_CHUNK, n - got);
      var a = addr + got;
      var piece;
      if (hb && a >= hb && a < hb + 0x40000000) {
        piece = await peekHeap(a - hb, thisLen);
      } else {
        var mb1 = await getMainBase();
        piece = await peekMain(a - mb1, thisLen);   // ⚠️ peekMain 要偏移（减 mainBase）
      }
      if (!piece || piece.length === 0) break;
      out.set(piece.subarray(0, Math.min(piece.length, n - got)), got);
      if (piece.length < thisLen) break;   // 读不满，结束
      got += thisLen;
    }
    return out;
  }

  /** 大块写：把 data 写到绝对地址 addr（自动按 WRITE_CHUNK 分块） */
  async function writeRange(addr, data) {
    var hb = await getHeapBase();
    var total = data.length;
    var done = 0;
    while (done < total) {
      var thisLen = Math.min(WRITE_CHUNK, total - done);
      var a = addr + done;
      var part = data.subarray(done, done + thisLen);
      var hexs = '0x' + bytesToHex(part);
      if (hb && a >= hb && a < hb + 0x40000000) {
        await Bridge.cmd('poke 0x' + (a - hb).toString(16).toUpperCase() + ' ' + hexs);
      } else {
        var mb2 = await getMainBase();
        await Bridge.cmd('pokeMain 0x' + (a - mb2).toString(16).toUpperCase() + ' ' + hexs);  // ⚠️ 减 mainBase
      }
      done += thisLen;
    }
    return true;
  }

  return {
    hexToBytes: hexToBytes,
    bytesToHex: bytesToHex,
    u64: u64,
    u32: u32,
    putU32: putU32,
    getHeapBase: getHeapBase,
    getMainBase: getMainBase,
    resetCache: resetCache,
    peekHeap: peekHeap,
    peekMain: peekMain,
    pokeHeap: pokeHeap,
    pokeMain: pokeMain,
    readAbs: readAbs,
    writeAbs: writeAbs,
    readRange: readRange,
    writeRange: writeRange
  };
})();
</script>

<script>
/* ============================================================
 * quest.js —— 怪异任务业务逻辑（指针链定位 + 任务解析 + 读写）
 * 依赖：data.js（FIELDS / MONSTERS / MAPS / STRUCT）、memory.js（Mem）
 * ============================================================ */

var Quest = (function () {

  // ---------- 指针链（ASLR 安全）----------
  // p1 = *(main + 0x12A58748)
  // p2 = *(p1 + 0x100)
  // p3 = *(p2 + 0x28)
  // base = p3 + 0x20
  async function questBase() {
    var p1 = Mem.u64(await Mem.peekMain(STRUCT.MAIN_PTR_OFFSET, 8));
    var p2 = Mem.u64(await Mem.readAbs(p1 + 0x100, 8));
    var p3 = Mem.u64(await Mem.readAbs(p2 + 0x28, 8));
    return p3 + 0x20;
  }

  /** 解析 116 字节 -> 对象 */
  function parseQuest(raw, index, addr) {
    var t = { index: index, addr: addr.toString(16).toUpperCase().padStart(16, '0') };
    for (var i = 0; i < FIELDS.length; i++) {
      var f = FIELDS[i];
      t[f.name] = (f.size === 4) ? Mem.u32(raw, f.off) : raw[f.off];
    }
    return t;
  }

  /** 读单个任务 */
  async function getQuest(base, index) {
    var addr = base + index * STRUCT.TASK_SIZE;
    var raw = await Mem.readAbs(addr, STRUCT.TASK_SIZE);
    if (!raw || raw.length < STRUCT.TASK_SIZE) return null;
    return parseQuest(raw, index, addr);
  }

  /** 读全部任务（一次大块读，本地切片解析） */
  async function getAllQuests(onProgress) {
    var base = await questBase();
    if (!base) throw new Error('定位任务数组失败（游戏没开？）');
    var total = STRUCT.TASK_COUNT * STRUCT.TASK_SIZE;
    var buf = await Mem.readRange(base, total);   // ⚡ 一次读完 200 槽
    var out = [];
    for (var i = 0; i < STRUCT.TASK_COUNT; i++) {
      var off = i * STRUCT.TASK_SIZE;
      var raw = buf.subarray(off, off + STRUCT.TASK_SIZE);
      var t = parseQuest(raw, i, base + off);
      if (t['编号'] >= STRUCT.TASK_ID_BASE &&
          t['编号'] <= STRUCT.TASK_ID_BASE + STRUCT.TASK_COUNT) {
        out.push(t);
      }
    }
    if (onProgress) onProgress(STRUCT.TASK_COUNT, STRUCT.TASK_COUNT);
    return out;
  }

  /**
   * 写单个任务的多个字段（一次读→改→写→回读）
   * changes = [{off, size, value}, ...]
   * 返回 {ok, got}
   */
  async function setQuestFields(base, index, changes) {
    var addr = base + index * STRUCT.TASK_SIZE;
    var raw = await Mem.readAbs(addr, STRUCT.TASK_SIZE);
    if (!raw || raw.length < STRUCT.TASK_SIZE) return { ok: false, got: null };

    var buf = new Uint8Array(raw);  // 复制
    var want = [];
    for (var i = 0; i < changes.length; i++) {
      var c = changes[i];
      if (c.size === 4) Mem.putU32(buf, c.off, c.value);
      else buf[c.off] = c.value & 0xFF;
      want.push(c);
    }
    await Mem.writeAbs(addr, buf);

    // 回读校验
    var chk = await Mem.readAbs(addr, STRUCT.TASK_SIZE);
    if (!chk || chk.length < STRUCT.TASK_SIZE) return { ok: false, got: null };
    var allok = true;
    for (var j = 0; j < want.length; j++) {
      var c2 = want[j];
      var g = (c2.size === 4) ? Mem.u32(chk, c2.off) : chk[c2.off];
      if (g !== c2.value) allok = false;
    }
    return { ok: allok, got: true };
  }

  /** 批量：对若干索引统一写一个字段（一次大块读 + 本地改 + 大块写回） */
  async function setManyQuests(base, idxs, off, size, value, onProgress) {
    if (!idxs.length) return 0;
    var minI = Math.min.apply(null, idxs);
    var maxI = Math.max.apply(null, idxs);
    var startAddr = base + minI * STRUCT.TASK_SIZE;
    var span = (maxI - minI + 1) * STRUCT.TASK_SIZE;
    var buf = await Mem.readRange(startAddr, span);   // ⚡ 一次读
    var hit = {};
    for (var k = 0; k < idxs.length; k++) hit[idxs[k]] = true;
    for (var i = 0; i < idxs.length; i++) {
      var local = (idxs[i] - minI) * STRUCT.TASK_SIZE;   // 在 buf 里的偏移
      if (size === 4) Mem.putU32(buf, local + off, value);
      else buf[local + off] = value & 0xFF;
    }
    await Mem.writeRange(startAddr, buf);   // ⚡ 大块写回
    if (onProgress) onProgress(idxs.length, idxs.length);
    return idxs.length;
  }

  /** 批量：每个索引写不同的值（累加用）——一次大块读 + 本地改 + 大块写回
   *  vals = { index: value }
   */
  async function setManyQuestsDiff(base, indexList, off, size, values, onProgress) {
    if (!indexList.length) return 0;
    var minI = Math.min.apply(null, indexList);
    var maxI = Math.max.apply(null, indexList);
    var startAddr = base + minI * STRUCT.TASK_SIZE;
    var span = (maxI - minI + 1) * STRUCT.TASK_SIZE;
    var buf = await Mem.readRange(startAddr, span);   // ⚡ 一次读
    for (var i = 0; i < indexList.length; i++) {
      var ix = indexList[i];
      var local = (ix - minI) * STRUCT.TASK_SIZE;
      var v = values[ix];
      if (size === 4) Mem.putU32(buf, local + off, v);
      else buf[local + off] = v & 0xFF;
    }
    await Mem.writeRange(startAddr, buf);   // ⚡ 大块写回
    if (onProgress) onProgress(indexList.length, indexList.length);
    return indexList.length;
  }

  /** 批量"清空"：把多个任务都打成删除标记
   *  删除标记 = 序号(0x00)=FFFFFFFF、编号(0x04)=FFFFFFFF、叹号(0x68)=256
   *  ⚡ 一次大块读 → 本地打标记 → 一次大块写回（比逐个快几十倍）
   */
  async function clearManyQuests(base, indexList, onProgress) {
    if (!indexList.length) return 0;
    var minI = Math.min.apply(null, indexList);
    var maxI = Math.max.apply(null, indexList);
    var startAddr = base + minI * STRUCT.TASK_SIZE;
    var span = (maxI - minI + 1) * STRUCT.TASK_SIZE;
    var buf = await Mem.readRange(startAddr, span);   // ⚡ 一次读
    for (var i = 0; i < indexList.length; i++) {
      var local = (indexList[i] - minI) * STRUCT.TASK_SIZE;
      Mem.putU32(buf, local + 0x00, 0xFFFFFFFF);
      Mem.putU32(buf, local + 0x04, 0xFFFFFFFF);
      Mem.putU32(buf, local + 0x68, 256);
    }
    await Mem.writeRange(startAddr, buf);   // ⚡ 大块写回
    if (onProgress) onProgress(indexList.length, indexList.length);
    return indexList.length;
  }

  /** 批量"恢复"：把多个已删除的槽变回有效任务
   *  items = { index: {seq, num} }   —— 每个槽要写入的 序号 / 编号
   *  写入：序号(0x00)=seq、编号(0x04)=num、叹号(0x68)=1
   *  ⚡ 一次大块读 → 本地改 → 一次大块写回
   */
  async function restoreManyQuests(base, items, onProgress) {
    var ks = Object.keys(items).map(Number);
    if (!ks.length) return 0;
    var minI = Math.min.apply(null, ks);
    var maxI = Math.max.apply(null, ks);
    var startAddr = base + minI * STRUCT.TASK_SIZE;
    var span = (maxI - minI + 1) * STRUCT.TASK_SIZE;
    var buf = await Mem.readRange(startAddr, span);   // ⚡ 一次读
    for (var i = 0; i < ks.length; i++) {
      var ix = ks[i];
      var local = (ix - minI) * STRUCT.TASK_SIZE;
      Mem.putU32(buf, local + 0x00, items[ix].seq >>> 0);
      Mem.putU32(buf, local + 0x04, items[ix].num >>> 0);
      Mem.putU32(buf, local + 0x68, 1);   // 叹号 = 1（显示"新任务"）
    }
    await Mem.writeRange(startAddr, buf);   // ⚡ 大块写回
    if (onProgress) onProgress(ks.length, ks.length);
    return ks.length;
  }

  /** 读全部 200 个槽的"原始 116 字节"（含空槽，用于导出）
   *  返回 [{index, addr, raw(hex), ok}]  —— 一次大块读
   */
  async function getAllRaw(onProgress) {
    var base = await questBase();
    if (!base) throw new Error('定位任务数组失败（游戏没开？）');
    var total = STRUCT.TASK_COUNT * STRUCT.TASK_SIZE;
    var buf = await Mem.readRange(base, total);   // ⚡ 一次读完 200 槽
    var out = [];
    for (var i = 0; i < STRUCT.TASK_COUNT; i++) {
      var off = i * STRUCT.TASK_SIZE;
      var raw = buf.subarray(off, off + STRUCT.TASK_SIZE);
      out.push({
        index: i,
        addr: (base + off).toString(16).toUpperCase(),
        raw: Mem.bytesToHex(raw),
        ok: raw && raw.length === STRUCT.TASK_SIZE
      });
    }
    if (onProgress) onProgress(STRUCT.TASK_COUNT, STRUCT.TASK_COUNT);
    return out;
  }

  /** 写回整块 116 字节（十六进制字符串） */
  async function writeRaw(base, index, hex) {
    var addr = base + index * STRUCT.TASK_SIZE;
    await Mem.writeAbs(addr, Mem.hexToBytes(hex));
    return true;
  }

  /** 整批写回：把 200 个槽的数据一次大块写（用于"上传到游戏"提速）
   *  slots = [{index, raw(hex)}]（需覆盖 [0..TASK_COUNT)，缺失的槽跳过）
   */
  async function writeAllRaw(slots, onProgress) {
    var base = await questBase();
    if (!base) throw new Error('定位任务数组失败（游戏没开？）');
    // 拼成连续 buffer：按 index 填入，缺失的槽保留"空槽标准长相"
    var total = STRUCT.TASK_COUNT * STRUCT.TASK_SIZE;
    var buf = new Uint8Array(total);
    var have = {};   // index -> true
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      if (s.index < 0 || s.index >= STRUCT.TASK_COUNT) continue;
      var bytes = Mem.hexToBytes(s.raw);
      var off = s.index * STRUCT.TASK_SIZE;
      buf.set(bytes.subarray(0, STRUCT.TASK_SIZE), off);
      have[s.index] = true;
    }
    // 没填的槽 → 空槽标准长相（序号/编号=FFFFFFFF，叹号=256），避免误写成 0
    for (var k = 0; k < STRUCT.TASK_COUNT; k++) {
      if (have[k]) continue;
      var off2 = k * STRUCT.TASK_SIZE;
      Mem.putU32(buf, off2 + 0x00, 0xFFFFFFFF);
      Mem.putU32(buf, off2 + 0x04, 0xFFFFFFFF);
      Mem.putU32(buf, off2 + 0x68, 256);
    }
    await Mem.writeRange(base, buf);   // ⚡ 大块写
    if (onProgress) onProgress(STRUCT.TASK_COUNT, STRUCT.TASK_COUNT);
    return STRUCT.TASK_COUNT;
  }

  // ---------- 序号计数器（游戏获得新怪异任务时取用的"序号"来源）----------
  // 金手指：640F0000 11A2E990 00000409
  //   前 3 行指针链：
  //     reg0 = u64(peekMain(0x12A58748))
  //     reg1 = u64(reg0 + 0x100)
  //     reg0 = reg1 + 0x34          <-- 序号计数器地址!
  //   末行把 8 字节 [00000409][90E9A211] 写到 reg0：
  //     +0x00 = 00000409 (1033)  ← 序号计数器的值
  //     +0x04 = 11A2E990 (其余字节，游戏会改动)
  // 实测（重启游戏后）：reg1+0x34 读出 = 1033 ✅
  /** 定位"序号计数器"地址（ASLR 安全） */
  async function seqCounterAddr() {
    var reg0 = Mem.u64(await Mem.peekMain(STRUCT.MAIN_PTR_OFFSET, 8));
    if (!reg0) return null;
    var reg1 = Mem.u64(await Mem.readAbs(reg0 + 0x100, 8));
    if (!reg1) return null;
    return reg1 + STRUCT.SEQ_COUNTER_DELTA;   // + 0x34
  }

  /** 读"序号计数器"（游戏获得新怪异任务时取用的序号来源） */
  async function readSeqCounter() {
    var addr = await seqCounterAddr();
    if (!addr) return null;
    var bytes = await Mem.readAbs(addr, 4);
    if (!bytes || bytes.length < 4) return null;
    return Mem.u32(bytes, 0);
  }

  /** 写"序号计数器" */
  async function writeSeqCounter(value) {
    var addr = await seqCounterAddr();
    if (!addr) return false;
    var b = new Uint8Array(4);
    Mem.putU32(b, 0, value >>> 0);
    await Mem.writeAbs(addr, b);
    // 回读校验
    var chk = await Mem.readAbs(addr, 4);
    if (!chk || chk.length < 4) return false;
    return Mem.u32(chk, 0) === (value >>> 0);
  }

  function monName(id) {
    if (!id) return '无';
    return MONSTERS[id] || ('未知(0x' + Number(id).toString(16).toUpperCase() + ')');
  }
  function mapName(id) {
    if (!id) return '—';
    return MAPS[id] || ('地图' + id);
  }
  function enumName(enumKey, v) {
    var en = ENUMS[enumKey] || {};
    return en[String(v)] || '';
  }
  function fieldByName(name) {
    for (var i = 0; i < FIELDS.length; i++) if (FIELDS[i].name === name) return FIELDS[i];
    return null;
  }

  /** 构造任务的"怪物列表"（用于列表显示） */
  function monsterList(t) {
    var arr = [];
    var keys = ['怪1ID', '怪2ID', '怪3ID', '怪4ID', '怪5ID'];
    for (var i = 0; i < keys.length; i++) {
      var mid = t[keys[i]];
      if (mid) arr.push({ id: mid, name: monName(mid), lv: t['怪' + (i + 1) + '级'], inv: false });
    }
    if (t['乱入ID']) arr.push({ id: t['乱入ID'], name: '乱入:' + monName(t['乱入ID']), lv: t['乱入级'], inv: true });
    return arr;
  }

  return {
    questBase: questBase,
    getQuest: getQuest,
    getAllQuests: getAllQuests,
    setQuestFields: setQuestFields,
    setManyQuests: setManyQuests,
    setManyQuestsDiff: setManyQuestsDiff,
    clearManyQuests: clearManyQuests,
    restoreManyQuests: restoreManyQuests,
    getAllRaw: getAllRaw,
    writeRaw: writeRaw,
    writeAllRaw: writeAllRaw,
    parseQuest: parseQuest,
    readSeqCounter: readSeqCounter,
    writeSeqCounter: writeSeqCounter,
    monName: monName,
    mapName: mapName,
    enumName: enumName,
    fieldByName: fieldByName,
    monsterList: monsterList
  };
})();
</script>

<script>
/* ============================================================
 * store.js —— 数据源层（在线内存 / 离线文件）
 *
 * 只有两种数据源，二选一：
 *   1) 在线：从 Switch 内存读（Store.loadFromSwitch）
 *   2) 离线：从"打开的文件"载入（Store.loadFile）
 *
 * 上层界面（app.js）只跟 Store 打交道。
 * 数据结构：slots = [{ index, raw(hex, 232字符), fields(对象) }]
 * ============================================================ */

var Store = (function () {

  var slots = [];       // 200 槽：[{index, raw, fields}]
  var mode = 'none';    // 'online' | 'file' | 'none'
  var sourceInfo = '';  // 数据来源描述
  var seqCounter = null; // 序号计数器（游戏获得新怪异任务时取用的序号来源）；null = 未知/文件里没有

  // ---------- 原始 hex ↔ fields ----------
  function rawToFields(rawHex) {
    var bytes = Mem.hexToBytes(rawHex);
    var o = {};
    for (var i = 0; i < FIELDS.length; i++) {
      var f = FIELDS[i];
      o[f.name] = (f.size === 4) ? Mem.u32(bytes, f.off) : bytes[f.off];
    }
    return o;
  }

  function isValid(fields) {
    var n = fields['编号'];
    return n >= STRUCT.TASK_ID_BASE && n <= STRUCT.TASK_ID_BASE + STRUCT.TASK_COUNT;
  }

  /** 本地修改某个槽（离线编辑 / 在线改后同步） */
  function setSlot(index, rawHex) {
    for (var i = 0; i < slots.length; i++) {
      if (slots[i].index === index) {
        slots[i].raw = rawHex;
        slots[i].fields = rawToFields(rawHex);
        return true;
      }
    }
    slots.push({ index: index, raw: rawHex, fields: rawToFields(rawHex) });
    slots.sort(function (a, b) { return a.index - b.index; });
    return true;
  }

  /** 本地按字段改某个槽（离线编辑核心） */
  function setSlotFields(index, changes) {
    var slot = null;
    for (var i = 0; i < slots.length; i++) if (slots[i].index === index) { slot = slots[i]; break; }
    if (!slot) return false;
    var bytes = Mem.hexToBytes(slot.raw);
    for (var j = 0; j < changes.length; j++) {
      var c = changes[j];
      if (c.size === 4) Mem.putU32(bytes, c.off, c.value);
      else bytes[c.off] = c.value & 0xFF;
    }
    slot.raw = Mem.bytesToHex(bytes);
    slot.fields = rawToFields(slot.raw);
    return true;
  }

  function getSlot(index) {
    for (var i = 0; i < slots.length; i++) if (slots[i].index === index) return slots[i];
    return null;
  }

  // ---------- 数据源 1：Switch 内存 ----------
  async function loadFromSwitch(onProgress) {
    var raw = await Quest.getAllRaw(onProgress);
    slots = raw.map(function (s) {
      return { index: s.index, raw: s.raw, fields: rawToFields(s.raw) };
    });
    // 顺便读"序号计数器"
    try {
      seqCounter = await Quest.readSeqCounter();
    } catch (e) {
      seqCounter = null;
    }
    mode = 'online';
    sourceInfo = 'Switch 内存';
    return slots;
  }

  // ---------- 数据源 2：打开的文件 ----------
  function loadFile(d, fname) {
    if (!d || !d.quests || !d.quests.length) return false;
    slots = d.quests.map(function (item) {
      return {
        index: item.index,
        raw: item.raw,
        fields: item.fields || rawToFields(item.raw)
      };
    });
    // 补齐：如果文件里只有部分槽，其余槽补空（全 0）
    var have = {};
    for (var i = 0; i < slots.length; i++) have[slots[i].index] = true;
    for (var s = 0; s < STRUCT.TASK_COUNT; s++) {
      if (!have[s]) slots.push({ index: s, raw: emptyRaw(), fields: rawToFields(emptyRaw()) });
    }
    slots.sort(function (a, b) { return a.index - b.index; });
    // 序号计数器（文件里带了就用）
    seqCounter = (typeof d.seqCounter === 'number') ? d.seqCounter : null;
    mode = 'file';
    sourceInfo = fname ? ('文件：' + fname) : '打开的文件';
    return true;
  }

  /** 一个"空槽"的 116 字节：编号/序号=FFFFFFFF, 叹号=256 */
  function emptyRaw() {
    var b = new Uint8Array(STRUCT.TASK_SIZE);
    Mem.putU32(b, 0x00, 0xFFFFFFFF);
    Mem.putU32(b, 0x04, 0xFFFFFFFF);
    Mem.putU32(b, 0x68, 256);
    return Mem.bytesToHex(b);
  }

  /** 导出成 JSON 对象 */
  function toExport() {
    return {
      app: '怪异任务编辑器',
      version: 1,
      game: 'MONSTER HUNTER RISE 16.0.2',
      taskSize: STRUCT.TASK_SIZE,
      taskCount: STRUCT.TASK_COUNT,
      seqCounter: seqCounter,     // 序号计数器（新任务序号来源）
      exportedAt: new Date().toISOString(),
      quests: slots.map(function (s) {
        return {
          index: s.index,
          raw: s.raw,
          fields: s.fields,
          empty: !isValid(s.fields)
        };
      })
    };
  }

  /** 取"有效任务"列表（给界面用，等价于旧的 ALL） */
  function validTasks() {
    var out = [];
    for (var i = 0; i < slots.length; i++) {
      if (isValid(slots[i].fields)) {
        var t = {};
        for (var k in slots[i].fields) t[k] = slots[i].fields[k];
        t.index = slots[i].index;
        t.addr = (slots[i].index * STRUCT.TASK_SIZE).toString(16).toUpperCase();
        out.push(t);
      }
    }
    return out;
  }

  /** 全部空槽索引 */
  function emptySlots() {
    var out = [];
    for (var i = 0; i < slots.length; i++) {
      if (!isValid(slots[i].fields)) out.push(slots[i].index);
    }
    return out;
  }

  function getSlots() { return slots; }
  function getMode() { return mode; }
  function getSource() { return sourceInfo; }
  function getSeqCounter() { return seqCounter; }
  function setSeqCounter(v) { seqCounter = (v === null || v === undefined) ? null : (v >>> 0); }
  function clear() { slots = []; mode = 'none'; sourceInfo = ''; seqCounter = null; }

  return {
    rawToFields: rawToFields,
    isValid: isValid,
    setSlot: setSlot,
    setSlotFields: setSlotFields,
    getSlot: getSlot,
    loadFromSwitch: loadFromSwitch,
    loadFile: loadFile,
    emptyRaw: emptyRaw,
    toExport: toExport,
    validTasks: validTasks,
    emptySlots: emptySlots,
    getSlots: getSlots,
    getMode: getMode,
    getSource: getSource,
    getSeqCounter: getSeqCounter,
    setSeqCounter: setSeqCounter,
    clear: clear
  };
})();
</script>

<script>
/* ============================================================
 * app.js —— 界面逻辑（渲染、编辑、选择器、批量）
 * 依赖：data.js / bridge.js / memory.js / quest.js
 * ============================================================ */

var $ = function (id) { return document.getElementById(id); };
var ALL = [];      // 已读取的任务
var VISIBLE = [];  // 当前列表（经筛选/搜索/排序后，给"批量改"用）
var BASE = null;   // 任务数组基址（缓存）

// ---------- 弹窗开关（锁定/恢复背景滚动，避免"关掉弹窗后列表位置变了"）----------
var _bodyLocked = false;    // 是否已锁定（用独立标志，不能用 0 当哨兵！）
var _bodyScrollY = 0;
function lockBodyScroll() {
  if (_bodyLocked) return;   // 已经锁过
  _bodyScrollY = window.scrollY || window.pageYOffset || 0;
  _bodyLocked = true;
  document.body.style.position = 'fixed';
  document.body.style.top = (-_bodyScrollY) + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll() {
  if (!_bodyLocked) return;   // 没锁过 → 什么都不做
  _bodyLocked = false;
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, _bodyScrollY);
}
/** 显示遮罩弹窗（自动锁定背景滚动）*/
function showOverlay() {
  $('overlay').classList.add('show');
  lockBodyScroll();
}
/** 关闭遮罩弹窗（自动恢复背景滚动位置）*/
function hideOverlay() {
  $('overlay').classList.remove('show');
  unlockBodyScroll();
}
/** 兜底：如果遮罩已隐藏但 body 还锁着，强制解锁（防卡死）*/
function ensureUnlocked() {
  var ov = $('overlay');
  if (ov && !ov.classList.contains('show')) unlockBodyScroll();
}

// ---------- 输入框限制（按字段字节数）----------
// size=4 → 有符号 int32: -2147483648 ~ 2147483647
// size=1 → 有符号 int8 : -128 ~ 127
function fieldMax(f) {
  return (f && f.size === 1) ? 127 : 2147483647;
}
/** 生成 input 的公共属性（有符号上下限 + 只能整数）*/
function numAttrs(f) {
  return ' type="number" min="' + fieldMin(f) + '" max="' + fieldMax(f) + '" step="1"'
       + ' inputmode="numeric" oninput="clampInput(this)"';
}
/** 输入时把值夹到 [min, max] */
function clampInput(el) {
  if (el.value === '') return;
  var v = parseInt(el.value, 10);
  if (isNaN(v)) { el.value = ''; return; }
  var lo = parseInt(el.min, 10), hi = parseInt(el.max, 10);
  if (!isNaN(lo) && v < lo) v = lo;
  if (!isNaN(hi) && v > hi) v = hi;
  if (String(v) !== el.value) el.value = v;
}
/** 取字段值并夹到该字段的合法范围（写入前的最后一道防线）——返回【无符号位模式】*/
function clampFieldVal(f, raw) {
  var v = parseInt(raw, 10);
  if (isNaN(v)) v = 0;
  var lo = fieldMin(f), hi = fieldMax(f);
  if (v < lo) v = lo;
  if (v > hi) v = hi;
  return toUnsigned(v, f && f.size);   // 转为无符号位模式，供写入
}

// ---------- 有符号 / 无符号转换 ----------
// 内存里按"位模式"存储（补码），显示与输入按"有符号"解释。
// 业务判断（如空槽 === 0xFFFFFFFF）仍然用无符号，避免失效。
/** 无符号位模式 → 有符号数（用于显示）*/
function toSigned(u, size) {
  u = (u >>> 0);
  if (size === 1) return (u & 0xFF) << 24 >> 24;              // int8
  return (u & 0xFFFFFFFF) | 0;                                // int32（JS 位运算天然 32 位有符号）
}
/** 有符号数 → 无符号位模式（用于写入）*/
function toUnsigned(v, size) {
  v = parseInt(v, 10) || 0;
  if (size === 1) return (v & 0xFF) >>> 0;
  return (v >>> 0);
}
/** 字段的最小子值（有符号）*/
function fieldMin(f) { return (f && f.size === 1) ? -128 : -2147483648; }

function toast(msg, ms) {
  ms = ms || 2400;
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, ms);
}
function setDot(cls, text) { $('dot').className = 'dot ' + (cls || ''); $('stat').textContent = text; }

/** 更新按钮进度文本 */
function busy(btn, on, text) {
  if (on) { btn.disabled = true; btn._t = btn.textContent; btn.textContent = text; }
  else { btn.disabled = false; if (btn._t) btn.textContent = btn._t; }
}

// ---------- 加载 ----------

var _busy = false;   // 全局忙碌锁：读取/写入期间禁止重复操作

/** 禁用/启用一组按钮 */
function setBusy(on) {
  _busy = on;
  var ids = ['reload', 'addBtn', 'batch', 'exportBtn', 'openBtn', 'writeBackBtn', 'cfgBtn'];
  for (var i = 0; i < ids.length; i++) {
    var b = $(ids[i]);
    if (b) b.disabled = on;
  }
}

/** 在线加载：从 Switch 读 200 槽 */
async function load() {
  if (_busy) return;          // ← 防止重复点击
  setBusy(true);
  setDot('', '读取中…');
  $('loading').style.display = 'none';
  $('list').innerHTML = '';
  var pb = $('progressbar');
  pb.classList.add('show');
  pb.querySelector('.pbar-txt').textContent = '定位任务数组…';
  pb.querySelector('.pbar-fill').style.width = '0%';
  try {
    var st = await Bridge.status();
    if (!st.connected) { setDot('err', 'Switch 未连接'); }
    Mem.resetCache();

    await Store.loadFromSwitch(function (cur, total) {
      var pct = Math.round(cur / total * 100);
      pb.querySelector('.pbar-txt').textContent = '读取中 ' + cur + '/' + total +
        '（' + pct + '%，约剩 ' + Math.round((total - cur) * 0.11) + ' 秒）';
      pb.querySelector('.pbar-fill').style.width = pct + '%';
    });
    BASE = await Quest.questBase();
    ALL = Store.validTasks();
    setDot('ok', ALL.length + ' 个任务 · ' + st.ip + ':' + st.port);
    pb.classList.remove('show');
    updateModeTag();
    updateSeqStat();
    render();
  } catch (e) {
    pb.classList.remove('show');
    setDot('err', '未连接中转');
    $('loading').style.display = 'block';
    $('loading').innerHTML = '❌ 连不上中转<br><br>' +
      '当前地址：<b>' + Bridge.getBase() + '</b><br>' +
      '错误：' + e.message + '<br><br>' +
      '<button onclick="cfgAddr()">⚙️ 修改中转地址</button><br><br>' +
      '👉 或者点「📥 打开文件」，离线编辑任务文件（不需要 NS）';
  } finally {
    setBusy(false);           // ← 无论如何都解锁
  }
}

/** 从"数据源"刷新界面（不读内存）——用于文件模式 */
function refreshFromStore() {
  ALL = Store.validTasks();
  if (Store.getMode() === 'online') {

  } else {

function updateSeqStat() {

  } else {

    el.style.color = '#58a6ff';
    el.title = '序号计数器 = ' + v + '（游戏获得新怪异任务时会取用此值作为任务序号）\n点击修改';

/** 点击顶部"序号计数器" → 修改 */
async function editSeqCounter() {
  if (_busy) return;
  var cur = Store.getSeqCounter();
  var s = prompt('修改「序号计数器」\n\n= 游戏在【获得新的怪异任务】时会取用的序号（取走后自己+1）\n\n当前值：' + (cur === null || cur === undefined ? '未知' : cur) + '\n\n输入新值（十进制）：', cur === null || cur === undefined ? '' : String(cur));
  if (s === null) return;                 // 取消
  s = s.trim();
  if (!/^\d+$/.test(s)) { toast('❌ 请输入非负整数', 3000); return; }
  var v = parseInt(s, 10) >>> 0;

  // 在线模式：直接写进 Switch
  if (Store.getMode() === 'online') {
    setBusy(true);
    try {
      var ok = await Quest.writeSeqCounter(v);
      Store.setSeqCounter(v);
      updateSeqStat();
      toast(ok ? ('✅ 序号计数器已设为 ' + v) : '⚠️ 写入后校验不一致，请检查', ok ? 2500 : 4000);
    } catch (e) {
      toast('❌ 写入失败：' + e.message, 4000);
    } finally { setBusy(false); }
  } else {
    // 文件模式：只改本地（导出时会带上）
    Store.setSeqCounter(v);
    updateSeqStat();
    toast('📄 已改（文件模式，导出时带上）', 3000);
  }
}

/** 顶部状态：在线/文件 */
function updateModeTag() {
  var el = $('modeTag');
  if (!el) return;
  if (Store.getMode() === 'file') {
    el.textContent = '📄 文件编辑模式';
    el.style.color = '#d29922';
    el.title = Store.getSource();
  } else if (Store.getMode() === 'online') {
    el.textContent = '';
    el.style.color = '';
  } else {
    el.textContent = '';
  }

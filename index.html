<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Switch 电量</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --sub:#8b949e; --accent:#58a6ff; --ok:#3fb950; --err:#f85149; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:20px;
  }
  .card {
    background:var(--card); border:1px solid #30363d; border-radius:16px;
    padding:28px 32px; width:100%; max-width:360px; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; color:var(--sub); letter-spacing:.5px; }
  .batt { font-size:72px; font-weight:800; line-height:1.1; margin:8px 0; }
  .batt .unit { font-size:28px; font-weight:600; color:var(--sub); }
  .bar { height:14px; background:#21262d; border-radius:8px; overflow:hidden; margin:16px 0; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#3fb950,#58a6ff); transition:width .5s ease; }
  .status { font-size:13px; color:var(--sub); margin-top:8px; }
  .status.ok { color:var(--ok); }
  .status.err { color:var(--err); }
  button {
    margin-top:20px; width:100%; padding:14px; font-size:16px; font-weight:600;
    color:#fff; background:var(--accent); border:0; border-radius:12px; cursor:pointer;
    transition:opacity .2s;
  }
  button:active { opacity:.7; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .cfg { margin-top:8px; font-size:12px; color:var(--sub); }
  .cfg input { width:100%; margin-top:6px; padding:8px; border-radius:8px;
    border:1px solid #30363d; background:#0d1117; color:var(--fg); font-size:13px; }
</style>
</head>
<body>

<div class="card">
  <h1>🔋 NINTENDO SWITCH</h1>
  <div class="batt"><span id="val">--</span><span class="unit">%</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="status" id="status">未连接</div>

  <button id="btn">读取电量</button>

  <div class="cfg">
    中转地址
    <input id="bridge" value="http://127.0.0.1:8080" />
  </div>
</div>

<script>
// 页面加载时自动改用当前主机的 8080（方便从手机/电脑浏览器打开）
(function autoHost(){
  const inp = document.getElementById('bridge');
  const h = location.hostname;
  if (h && h !== 'localhost' && h !== '127.0.0.1' && h !== '') {
    inp.value = `http://${h}:8080`;
  }
})();

const $ = id => document.getElementById(id);

function setStatus(text, cls){
  const el = $('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

async function cmd(text){
  const base = $('bridge').value.replace(/\/+$/, '');
  const r = await fetch(base + '/cmd', { method:'POST', body:text });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.text()).trim();
}

async function refresh(){
  const btn = $('btn');
  btn.disabled = true;
  setStatus('读取中…');
  try {
    // 1) 先探活
    const base = $('bridge').value.replace(/\/+$/, '');
    const st = await (await fetch(base + '/status')).json();
    if (!st.connected) { setStatus('中转在，但连不上 Switch', 'err'); return; }

    // 2) 读电量
    const raw = await cmd('charge');
    const n = parseInt(raw, 10);
    if (isNaN(n)) { setStatus('返回异常: ' + raw, 'err'); return; }

    $('val').textContent = n;
    $('bar').style.width = Math.max(0, Math.min(100, n)) + '%';
    setStatus(`已连接 ${st.ip}:${st.port} · 正常`, 'ok');
  } catch (e) {
    setStatus('失败: ' + e.message + '（检查中转是否在跑）', 'err');
  } finally {
    btn.disabled = false;
  }
}

$('btn').addEventListener('click', refresh);
// 打开自动读一次
refresh();
// 每 30 秒自动刷新
setInterval(refresh, 30000);
</script>
</body>
</html>

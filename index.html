// ============================================================
// 🎯 指针写入（手动输入指针链 → 把文字写进内存）
// ============================================================
//  用户给的链：main+12C16908+D0+B8
//  语义（sys-agent 的 pointerPeek 语义）：
//    ① 读 [main + off0]                → p1
//    ② 读 [p1 + off1]                  → p2
//    ③ 读 [p2 + off2] ...              → 最后一步落在最终地址
//  即：除了第一段是"main 内偏移"，后面每段都是"上一级指针 + 偏移后取指针"。
//  最后一段偏移不加跳转 —— 它就是最终写入地址。

/** 把文本转成 UTF-16LE 字节（汉字 2 字节，无 BOM） */
function textToUtf16le(str) {
  var out = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    out.push(c & 0xFF, (c >>> 8) & 0xFF);
  }
  return out;
}

/** 字节数组 -> 大写 hex */
function bytesToHexStr(arr) {
  var s = '';
  for (var i = 0; i < arr.length; i++) s += (arr[i] < 16 ? '0' : '') + arr[i].toString(16).toUpperCase();
  return s;
}

/** 解析 "12C16908+D0+B8" 这类链，返回 {mainOff, offs:[...]} */
function parsePtrChain(s) {
  s = String(s || '').trim().replace(/\s+/g, '');
  s = s.replace(/^main\+/i, '');                 // 允许用户带 main+ 前缀
  s = s.replace(/^0x/i, '');
  if (!s) throw new Error('指针链为空');
  var parts = s.split('+').filter(function (x) { return x !== ''; });
  if (!parts.length) throw new Error('指针链格式不对');
  var nums = parts.map(function (p) {
    var v = parseInt(p.replace(/^0x/i, ''), 16);
    if (isNaN(v)) throw new Error('无法解析段："' + p + '"（要十六进制，如 D0）');
    return v;
  });
  return { mainOff: nums[0], offs: nums.slice(1) };
}

/**
 * 按指针链计算最终绝对地址（只用读取，不写入）。
 * 链语义：main+mainOff 读指针 → 依次 +offs[i] 读指针 → 最后一段 offs 不加跳转，直接作为偏移。
 * 例：main+12C16908+D0+B8
 *   ① p1 = [main+12C16908]
 *   ② p2 = [p1 + D0]
 *   ③ 最终 addr = p2 + B8
 */
async function resolvePtrChain(mainOff, offs, log) {
  var mainBase = await Mem.getMainBase();
  var p = null;

  // 第一级：main + mainOff 处读 8 字节指针
  var b = await Mem.readAbs(mainBase + mainOff, 8);
  p = Mem.u64(b);
  if (log) log('① main+0x' + mainOff.toString(16).toUpperCase() + ' → 0x' + p.toString(16).toUpperCase());

  // 中间各级：+off 后读指针
  for (var i = 0; i < offs.length - 1; i++) {
    var a = p + offs[i];
    var bb = await Mem.readAbs(a, 8);
    p = Mem.u64(bb);
    if (log) log('② 0x' + a.toString(16).toUpperCase() + ' → 0x' + p.toString(16).toUpperCase());
  }

  // 最后一段：直接加偏移，不跳转
  var finalAddr = p + (offs.length ? offs[offs.length - 1] : 0);
  if (log) log('③ 最终地址 = 0x' + finalAddr.toString(16).toUpperCase());
  return finalAddr;
}

/** 最近一次「计算并写入」的地址与数据（供 ❄️锁定 / 🔥解除锁定 使用）
 *  只存在内存里：页面刷新就清空，避免误锁已经失效的旧地址。 */
var lastWrite = null;

/** 指针写入固定的指针链（原输入框已移除，写死在这里）
 *  main+12C16908 → +D0 → +B8  =  0x2E037A2320（MHRS 聊天输入框显示槽） */
var PTR_CHAIN = '12C16908+D0+B8';

/** ✂️ 分段写入的中断标志（true = 用户点了停止） */
var ptrChunkStop = false;

/** 可中断的等待：把长等待切成 50ms 小片，随时能响应停止
 *  返回 true = 正常等完；false = 被中断 */
async function ptrSleep(ms) {
  var end = Date.now() + ms;
  while (Date.now() < end) {
    if (ptrChunkStop) return false;
    var left = end - Date.now();
    await new Promise(function (r) { setTimeout(r, Math.min(50, left > 0 ? left : 0)); });
  }
  return !ptrChunkStop;
}

/** 收藏的文字（localStorage，越新越前） */
function ptrFavList() {
  try { return JSON.parse(localStorage.getItem('af.ptrFav') || '[]'); } catch (e) { return []; }
}
function ptrFavSave(arr) { localStorage.setItem('af.ptrFav', JSON.stringify(arr)); }
function ptrFavAdd(t) {
  t = String(t || '').trim();
  if (!t) return ptrFavList();
  var arr = ptrFavList().filter(function (x) { return x !== t; });
  arr.unshift(t);
  arr = arr.slice(0, 50);
  ptrFavSave(arr);
  return arr;
}
function ptrFavDel(t) { ptrFavSave(ptrFavList().filter(function (x) { return x !== t; })); }

/** 核心：按指针链把文字写进内存（解锁 → 写入 → 重新锁定）
 *  @param txt  要写入的文字
 *  @param log  日志回调（可为 null）
 *  返回 { ok, addr, hex }
 */
async function doPtrWrite(txt, log) {
  log = log || function () {};
  if (Store.getMode() === 'file') throw new Error('需要在线模式（连上 Switch）');
  txt = String(txt || '');
  if (!txt) throw new Error('文字为空');

  var hb = await Mem.getHeapBase();

  var ch = parsePtrChain(PTR_CHAIN);
  log('链：main+0x' + ch.mainOff.toString(16).toUpperCase() +
      ch.offs.map(function (o) { return '+0x' + o.toString(16).toUpperCase(); }).join(''));
  var addr = await resolvePtrChain(ch.mainOff, ch.offs, log);

  // ---------- 步骤 1：先解除锁定 ----------
  //  ⚠️ 不先解锁的话，freeze 线程每 3ms 会把旧值写回去，刚写的文字会被立即覆盖。
  //  注意 sys-agent 的 sub_freeze 线程在 IDLE 态睡 1 秒才查表，所以解锁后它"可能还会再写一次旧值"。
  //  这里不用死等，改为：解锁 → 写入 → 再检查一次，如果被盖回就重写（通常一次就成）。
  log('---');
  log('① 解除旧锁定');
  var useFreeze = (addr >= hb);
  var off = useFreeze ? (addr - hb) : 0;
  if (useFreeze) {
    await Bridge.cmd('unFreeze 0x' + off.toString(16).toUpperCase());
    log('   偏移 0x' + off.toString(16).toUpperCase() + ' 已解除');
  } else {
    log('   ⚠️ 地址小于 heapBase，跳过锁定步骤');
  }

  // ---------- 步骤 2：写入文字 ----------
  var bytes = textToUtf16le(txt);
  log('---');
  log('② 写入文字：「' + txt + '」');
  log('   UTF-16LE：' + bytesToHexStr(bytes) + '（' + bytes.length + ' 字节）');

  var before = await Mem.readAbs(addr, Math.max(bytes.length + 2, 32));
  log('   写前内容：' + bytesToHexStr(before));

  // 正文 + 结束符 0x0000：游戏读到 0x0000 才认为字符串结束
  var payload = bytes.concat([0x00, 0x00]);
  var wantHex = bytesToHexStr(payload);

  // 写入 + 回读校验；若被 freeze 线程残留写成旧值，自动重写（最多 3 次）
  var okWrite = false;
  for (var attempt = 1; attempt <= 3; attempt++) {
    await Mem.writeAbs(addr, new Uint8Array(payload));
    var after = await Mem.readAbs(addr, payload.length);
    var backHex = bytesToHexStr(after);
    if (backHex.toUpperCase() === wantHex.toUpperCase()) {
      okWrite = true;
      log('   ✅ 已写入并回读一致：' + backHex + (attempt > 1 ? '（第 ' + attempt + ' 次）' : ''));
      break;
    }
    log('   ⚠️ 第 ' + attempt + ' 次写入被覆盖，重试…');
    await new Promise(function (r) { setTimeout(r, 120); });
  }
  if (!okWrite) {
    log('   ⚠️ 写入后始终被覆盖（可能有东西在持续写这个地址）');
  }
  log('   地址：0x' + addr.toString(16).toUpperCase() +
      '，结束符位置：0x' + (addr + bytes.length).toString(16).toUpperCase());

  lastWrite = { addr: addr, hex: wantHex, size: payload.length, text: txt };

  // ---------- 步骤 3：重新锁定（不等待，锁上就返回）----------
  log('---');
  if (useFreeze) {
    log('③ 重新锁定');
    await Bridge.cmd('freeze 0x' + off.toString(16).toUpperCase() + ' 0x' + wantHex);
    log('   偏移 0x' + off.toString(16).toUpperCase() + ' = ' + wantHex);
    log('🏁 完成（地址 0x' + addr.toString(16).toUpperCase() + '）');
  } else {
    log('③ 跳过重新锁定（地址不在 heap 区）');
    log('🏁 完成（地址 0x' + addr.toString(16).toUpperCase() + '）');
  }

  return { ok: okWrite, addr: addr, hex: wantHex };
}

/** 渲染「指针写入」面板 */
async function renderPtrPanel() {
  var html = '<h2>🎯 指针写入</h2>' +
    '<div class="sub">文字 → UTF-16LE 写入（自动补结束符、自动重新锁定）</div>';

  if (Store.getMode() === 'file') {
    html += '<div class="hint">⚠️ 当前是<b>文件模式</b>，需要连上 Switch（在线模式）才能用。</div>';
  }

  html +=
    '<div class="sec">文字</div>' +
    '<div style="display:flex;gap:8px;align-items:stretch">' +
      '<input id="ptrText" placeholder="输入要写入的文字" style="flex:1;font-size:15px" />' +
      '<button id="ptrClear" class="ghost" title="清空输入框" style="padding:0 12px;flex:0 0 auto">✕</button>' +
    '</div>' +
    '<div class="hint" id="ptrPreview" style="margin:6px 0 0">（输入文字后显示编码预览）</div>' +

    '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button id="ptrWrite" style="flex:1">✅ 写入并锁定</button>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
      '<button id="ptrChunk" class="ghost" style="flex:1">✂️ 分段写入</button>' +
      '<button id="ptrChunkStop" class="ghost" style="flex:0 0 auto;display:none;color:var(--err);border-color:var(--err)">⏹ 停止</button>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
      '<button id="ptrFav" class="ghost" style="flex:1">⭐ 收藏</button>' +
      '<button id="ptrUnlock" class="ghost" style="flex:1">🔥 解除锁定</button>' +
    '</div>' +
    '<div class="hint" style="margin:8px 0 0">✂️ <b>分段写入</b>：每 20 字写一次并锁定，' +
      '中间按 3 下 <code>MINUS</code>（减号键），直到把整段文字发完。</div>' +

    '<div id="ptrLog" class="hint" style="margin-top:10px;white-space:pre-wrap;font-family:monospace;font-size:12px"></div>' +

    '<div class="sheet-actions" style="margin-top:14px">' +
      '<button class="ghost" id="ptrClose" style="width:100%">关闭</button>' +
    '</div>';

  $('sheet').innerHTML = html;
  showOverlay();

  var logEl = $('ptrLog');
  function log(s) { logEl.textContent += s + '\n'; }

  // ---- 编码预览 ----
  function updPreview() {
    var v = $('ptrText').value;
    var pv = $('ptrPreview');
    if (!v) { pv.textContent = '（输入文字后显示编码预览）'; return; }
    var bytes = textToUtf16le(v);
    pv.innerHTML = 'UTF-16LE：<code>' + bytesToHexStr(bytes) + '</code>' +
      ' <span class="sub">（' + v.length + ' 字符 / ' + bytes.length + ' 字节）</span>';
  }
  $('ptrText').addEventListener('input', updPreview);

  // ---- ✕ 清空输入框 ----
  $('ptrClear').onclick = function () {
    $('ptrText').value = '';
    updPreview();
    $('ptrText').focus();
  };

  $('ptrClose').onclick = function () { hideOverlay(); };

  // ---- ✅ 写入并锁定 ----
  $('ptrWrite').onclick = async function () {
    var txt = $('ptrText').value;
    if (!txt) { toast('请先输入要写入的文字'); return; }
    logEl.textContent = '';
    var btn = this;
    busy(btn, true, '⏳ 写入中…');
    try {
      await doPtrWrite(txt, log);
      toast('✅ 已写入并锁定（' + txt + '）', 3000);
    } catch (e) {
      log('❌ ' + e.message);
      toast('❌ 写入失败：' + e.message, 4000);
    }
    busy(btn, false);
  };

  // ---- ✂️ 分段写入：每 20 字写一次 + 锁定，然后按 3 下 MINUS ----
  //  节奏（用户定）：
  //    写入 → 等 1s → MINUS → 500ms → MINUS → 500ms → MINUS
  //    ⚠️ 第 3 下 MINUS 发出 = 游戏里真正发送了消息
  //    ⚠️ 两次「第 3 下 MINUS」的间隔必须落在 6~7 秒之间
  $('ptrChunk').onclick = async function () {
    var full = $('ptrText').value;
    if (!full) { toast('请先输入要写入的文字'); return; }

    var CHUNK = 20;              // 每段字数
    var AFTER_WRITE_MS = 1000;   // 写入完后等 1 秒再按键
    var GAP_1_2 = 1000;          // 第1下 → 第2下 的间隔
    var GAP_2_3 = 1000;          // 第2下 → 第3下 的间隔
    var SEND_GAP_TARGET = 6500;  // 两次"发送"（第3下MINUS）的目标间隔（6~7s 取中）
    var SEND_GAP_MIN = 6000;     // 判定用
    var SEND_GAP_MAX = 7000;

    var total = full.length;
    var parts = [];
    for (var i = 0; i < total; i += CHUNK) parts.push(full.substr(i, CHUNK));

    if (parts.length > 1) {
      if (!confirm('将把 ' + total + ' 字分成 ' + parts.length + ' 段依次写入并锁定，\n' +
                   '每段后按 3 下减号键（第 3 下 = 游戏发送）。\n' +
                   '两次发送间隔控制在 6~7 秒。\n\n' +
                   '⚠️ 运行中可点「⏹ 停止」中断（会在当前等待结束后停下）。\n\n确定开始？')) return;
    }

    logEl.textContent = '';
    log('✂️ 分段写入：共 ' + total + ' 字，分 ' + parts.length + ' 段（每段 ≤' + CHUNK + ' 字）');
    log('   节奏：写入 → 等 ' + AFTER_WRITE_MS + 'ms → MINUS → ' + GAP_1_2 +
        'ms → MINUS → ' + GAP_2_3 + 'ms → MINUS（第3下=发送）');
    log('   两次发送间隔：' + SEND_GAP_MIN + '~' + SEND_GAP_MAX + 'ms');
    log('');

    var btn = this;
    var stopBtn = $('ptrChunkStop');
    ptrChunkStop = false;
    // 运行中：显示「⏹ 停止」，主按钮变「运行中…」并禁用
    if (stopBtn) { stopBtn.style.display = ''; stopBtn.textContent = '⏹ 停止'; stopBtn.disabled = false; }
    btn.textContent = '⏳ 运行中…';
    btn.disabled = true;

    var done = 0;
    var lastSendAt = 0;
    function restoreBtns() {
      if (stopBtn) stopBtn.style.display = 'none';
      btn.textContent = '✂️ 分段写入';
      btn.disabled = false;
    }
    // 检查是否已请求停止；停止时打印提示并返回 true
    function halted(where) {
      if (ptrChunkStop) {
        log('⏹ 已停止（在' + where + '）');
        log('🏁 中断：已完成 ' + done + '/' + parts.length + ' 段');
        toast('⏹ 已停止（完成 ' + done + '/' + parts.length + ' 段）', 4000);
        return true;
      }
      return false;
    }

    try {
      for (var k = 0; k < parts.length; k++) {
        if (halted('下一段开始前')) break;

        var seg = parts[k];

        log('━━━ 第 ' + (k + 1) + '/' + parts.length + ' 段：「' + seg + '」（' + seg.length + ' 字）━━━');
        await doPtrWrite(seg, log);
        done++;

        // ⚠️ 最后一段也要按键！写入只是改内存，第 3 下 MINUS 才是真的游戏内发送。
        //    不按键的话最后这段永远发不出去。
        if (halted('第 ' + done + ' 段写入后')) break;

        // 写入完 → 等 1 秒（可中断）
        log('   ⏳ 等待 ' + AFTER_WRITE_MS + 'ms…');
        if (!await ptrSleep(AFTER_WRITE_MS)) { halted('写入后等待'); break; }

        // 时间轴调度：保证本次第3下落在上次发送 + SEND_GAP_TARGET 附近
        if (lastSendAt > 0) {
          // 从"现在"到第3下发出，还要经过 GAP_1_2 + GAP_2_3 + 三次按键耗时
          var estThirdAt = Date.now() + GAP_1_2 + GAP_2_3 + 400;
          var targetThirdAt = lastSendAt + SEND_GAP_TARGET;
          var preWait = targetThirdAt - estThirdAt;
          if (preWait > 0) {
            log('   ⏳ 距上次发送 ' + (Date.now() - lastSendAt) + 'ms，' +
                '为保证间隔≈' + SEND_GAP_TARGET + 'ms，先等 ' + preWait + 'ms…（可点停止）');
            if (!await ptrSleep(preWait)) { halted('节奏等待中'); break; }
          } else {
            log('   ⚠️ 已用掉 ' + (Date.now() - lastSendAt) + 'ms，间隔将超过目标');
          }
        }
        if (halted('按键前')) break;

        log('   ⌨️ MINUS (1/3)');
        try { await Quest.pressSeqWait('MINUS', 8000); } catch (e) { log('      ⚠️ 第1下失败：' + e.message); }
        if (!await ptrSleep(GAP_1_2)) { log('⏹ 已停止（第1下与第2下之间）'); toast('⏹ 已停止（已发 1/3）', 4000); break; }

        log('   ⌨️ MINUS (2/3)');
        try { await Quest.pressSeqWait('MINUS', 8000); } catch (e) { log('      ⚠️ 第2下失败：' + e.message); }
        if (!await ptrSleep(GAP_2_3)) { log('⏹ 已停止（第2下与第3下之间）'); toast('⏹ 已停止（已发 2/3，本轮未发送）', 4000); break; }

        log('   ⌨️ MINUS (3/3) ← 这一下就是游戏发送');
        try { await Quest.pressSeqWait('MINUS', 8000); } catch (e) { log('      ⚠️ 第3下失败：' + e.message); }
        var sendAt = Date.now();

        if (lastSendAt > 0) {
          var gap = sendAt - lastSendAt;
          var tag = (gap >= SEND_GAP_MIN && gap <= SEND_GAP_MAX) ? '✅' : '⚠️';
          log('   📏 本次发送间隔：' + gap + 'ms ' + tag);
        } else {
          log('   📏 首次发送');
        }
        lastSendAt = sendAt;
        log('');
      }
      if (!ptrChunkStop) {
        log('🏁 分段写入完成：共 ' + done + ' 段');
        toast('✅ 分段写入完成（' + done + ' 段）', 4000);
      }
    } catch (e) {
      log('❌ 第 ' + (done + 1) + ' 段失败：' + e.message);
      toast('❌ 第 ' + (done + 1) + ' 段失败：' + e.message, 5000);
    }
    ptrChunkStop = false;
    restoreBtns();
  };

  // ---- ⏹ 停止分段写入 ----
  $('ptrChunkStop').onclick = function () {
    ptrChunkStop = true;
    this.textContent = '⏹ 停止中…';
    this.disabled = true;
    setTimeout(function () {
      var b = $('ptrChunkStop');
      if (b) { b.textContent = '⏹ 停止'; b.disabled = false; }
    }, 3000);
  };

  // ---- ⭐ 收藏（弹出管理面板）----
  $('ptrFav').onclick = function () {
    var curText = $('ptrText').value;
    openPtrFavPanel({
      restoreText: curText,      // 返回时把输入框内容还原
      // 点某条收藏 → 直接执行「写入并锁定」
      onUse: async function (txt, favLog) {
        await doPtrWrite(txt, favLog);
      }
    });
  };

  // ---- 🔥 解除锁定 ----
  //  ⚠️ unFreeze 吃的是【相对 heap 的偏移】，不是绝对地址。
  $('ptrUnlock').onclick = async function () {
    if (Store.getMode() === 'file') { toast('需要在线模式（连上 Switch）'); return; }
    var btn = this;
    busy(btn, true, '⏳ 解除中…');
    try {
      var hb = await Mem.getHeapBase();
      var addr;
      if (lastWrite) {
        addr = lastWrite.addr;
      } else {
        // 还没写过，就按指针链现算一次
        var ch = parsePtrChain(PTR_CHAIN);
        addr = await resolvePtrChain(ch.mainOff, ch.offs, null);
      }
      if (addr < hb) throw new Error('地址不在 heap 区，无法解除锁定');
      var off = addr - hb;
      await Bridge.cmd('unFreeze 0x' + off.toString(16).toUpperCase());
      var cnt = await Bridge.cmd('freezeCount');
      log('🔥 已解除锁定 0x' + addr.toString(16).toUpperCase());
      log('   偏移（相对 heap）：0x' + off.toString(16).toUpperCase());
      log('   当前锁定总数：' + parseInt(cnt || '0', 16));
      toast('🔥 已解除锁定', 3000);
    } catch (e) {
      log('❌ 解除失败：' + e.message);
      toast('❌ 解除失败：' + e.message, 4000);
    }
    busy(btn, false);
  };
}

/** 收藏管理面板（独立弹窗）
 *  opts.onUse(txt, log) —— 点某条收藏时回调，用来执行「写入并锁定」
 */
function openPtrFavPanel(opts) {
  opts = opts || {};

  function render() {
    var arr = ptrFavList();
    var h = '<h2>⭐ 收藏</h2>' +
      '<div class="sub">点文字直接「写入并锁定」；点 ✕ 删除</div>';

    // 新增输入行
    h += '<div style="display:flex;gap:8px;align-items:stretch;margin-top:12px">' +
      '<input id="favNew" placeholder="添加新的收藏文字" style="flex:1;font-size:15px" />' +
      '<button id="favAddBtn" style="padding:0 14px;flex:0 0 auto">+ 添加</button>' +
      '</div>';

    // 列表
    h += '<div class="sec" style="margin-top:16px">已收藏（' + arr.length + '）</div>';
    if (!arr.length) {
      h += '<div class="hint">还没有收藏。在上面输入文字，点「+ 添加」。</div>';
    } else {
      h += '<div id="favList">';
      arr.forEach(function (t, i) {
        h += '<div class="frow" style="align-items:center;gap:8px;margin:6px 0">' +
          '<button data-fav-use="' + i + '" style="flex:1;text-align:left;font-size:15px">' +
            escapeHtml(t) + '</button>' +
          '<button data-fav-del="' + i + '" class="ghost" ' +
            'style="flex:0 0 auto;padding:0 12px;color:var(--err)">✕</button>' +
          '</div>';
      });
      h += '</div>';
    }

    h += '<div id="favLog" class="hint" style="margin-top:12px;white-space:pre-wrap;' +
      'font-family:monospace;font-size:12px"></div>';

    h += '<div class="sheet-actions" style="margin-top:14px">' +
      '<button class="ghost" id="favBack" style="width:100%">← 返回</button>' +
      '</div>';

    $('sheet').innerHTML = h;
    bindFav();
  }

  function bindFav() {
    var logEl = $('favLog');
    function log(s) { logEl.textContent += s + '\n'; }

    // 添加
    $('favAddBtn').onclick = function () {
      var v = $('favNew').value.trim();
      if (!v) { toast('请输入要收藏的文字'); return; }
      if (ptrFavList().indexOf(v) >= 0) { toast('已经在收藏里了'); return; }
      ptrFavAdd(v);
      render();
      toast('⭐ 已添加「' + v + '」', 2000);
    };
    $('favNew').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('favAddBtn').click();
    });

    // 删除
    $('sheet').querySelectorAll('[data-fav-del]').forEach(function (btn) {
      btn.onclick = function () {
        var arr = ptrFavList();
        var t = arr[parseInt(btn.dataset.favDel, 10)];
        ptrFavDel(t);
        render();
        toast('已删除「' + t + '」', 1800);
      };
    });

    // 点击 → 写入并锁定
    $('sheet').querySelectorAll('[data-fav-use]').forEach(function (btn) {
      btn.onclick = async function () {
        var arr = ptrFavList();
        var t = arr[parseInt(btn.dataset.favUse, 10)];
        if (!opts.onUse) return;
        if (Store.getMode() === 'file') { toast('需要在线模式（连上 Switch）'); return; }

        logEl.textContent = '';
        busy(btn, true, '⏳ 写入中…');
        try {
          await opts.onUse(t, log);
          toast('✅ 已写入并锁定（' + t + '）', 3000);
        } catch (e) {
          log('❌ ' + e.message);
          toast('❌ 写入失败：' + e.message, 4000);
        }
        busy(btn, false);
      };
    });

    // 返回主面板
    $('favBack').onclick = function () {
      // 直接重新渲染主面板（比还原 innerHTML 再重新绑事件更干净）
      renderPtrPanel().then(function () {
        var inp = $('ptrText');
        if (inp && opts.restoreText) {
          inp.value = opts.restoreText;
          inp.dispatchEvent(new Event('input'));
        }
      }).catch(function (e) { toast('返回失败：' + e.message, 3000); });
    };
  }

  render();
}

// ---------- 添加任务 ----------
// 空槽来源：文件模式看 Store，在线看 ALL
function findEmptySlot() {
  var all = findEmptySlots();
  return all.length ? all[0] : -1;
}

function findEmptySlots() {
  if (Store.getMode() === 'file') return Store.emptySlots();
  var used = {};
  for (var i = 0; i < ALL.length; i++) used[ALL[i].index] = true;
  var out = [];
  for (var s = 0; s < STRUCT.TASK_COUNT; s++) if (!used[s]) out.push(s);
  return out;
}

async function openAdd(slot) {
  // ⚠️ 按钮点击时 slot 收到的是 MouseEvent 对象，必须过滤成合法数字
  if (typeof slot !== 'number' || isNaN(slot)) {
    slot = findEmptySlot();
    if (slot < 0) {
      toast('没有空位了，请先删除一些任务', 4000);
      return;
    }
  }
  await buildAddSheet(slot);
}
/** 渲染"添加任务"面板（slot 可改，点 📋 重选） */
async function buildAddSheet(slot) {
  _addSlot = slot;

  // 读一次空槽的"遗留数据"（游戏删除只改了 3 个字段，其它还在）
  var q = {};
  try {
    if (Store.getMode() === 'file') {
      var slot0 = Store.getSlot(slot);
      if (slot0) q = Store.rawToFields(slot0.raw);
    } else {
      if (!BASE) BASE = await Quest.questBase();
      q = (await Quest.getQuest(BASE, slot)) || {};
    }
  } catch (e) { /* 读失败就按全 0 填 */ }

  // 每个字段的初值：用遗留数据；但 序号/编号/叹号 是"删除标记"，给合理默认
  // 🔢 「序号」默认用"序号计数器"当前值（跟游戏一致：游戏获得新怪异任务时也取用该值）
  var seqNow = Store.getSeqCounter();
  var seqDefault = (seqNow === null || seqNow === undefined) ? 1 : (seqNow >>> 0);
  // 🏷 「编号」默认 = 700000 + 空槽索引（实测规律：195/195 个非空槽都满足 编号==700000+槽）
  //     但保留可手动改（万一规律有个别例外，用户能纠正）
  var idDefault = STRUCT.TASK_ID_BASE + slot;
  function initVal(f) {
    if (f.name === '序号') {
      return seqDefault;   // ← 自动填计数器当前值（可手动改）
    }
    if (f.name === '编号') {
      // 万一同槽位的遗留数据里已有"合法且匹配当前槽"的编号，就用它；否则用规律值
      var n = q['编号'];
      if (typeof n === 'number' && n !== 0xFFFFFFFF && !isNaN(n) && n === idDefault) return n;
      return idDefault;    // ← 700000 + 槽索引（可手动改）
    }
    if (f.name === '叹号') {
      // ❗「叹号」= 新任务标记，添加新任务时默认 0（= 不显示新任务叹号）
      //    0=无 / 1=有 / 256=空槽（见 data.js 的「新任务叹号」枚举）
      return 0;
    }
    var v = q[f.name];
    return (v === undefined || v === null) ? 0 : v;
  }

  // 字段值缓存：所有字段的"当前值（有符号显示值）"
  // 用途：简洁模式下"隐藏字段"没有输入框，但仍要参与联动/写入
  _addFieldVals = {};
  FIELDS.forEach(function (f) {
    var v = initVal(f);
    _addFieldVals[f.name] = (f.size === 4 || f.size === 1) ? toSigned(v, f.size) : v;
  });

  var simpleAdd = isSimpleMode();
  var rows = FIELDS.filter(function (f) {
    if (!simpleAdd) return true;
    return SIMPLE_FIELDS.indexOf(f.name) >= 0;
  }).map(function (f) {
    var v = initVal(f);                                    // 无符号位模式（用于查表）
    var disp = _addFieldVals[f.name];                      // 有符号（用于显示）
    var btn = '', nm = '';
    if (f.kind === 'mon') {
      btn = '<button class="pick" data-pick="mon" data-field="' + f.name + '">📋</button>';
      nm = '<span class="nm" id="anm-' + f.name + '">' + (v ? Quest.monName(v) : '') + '</span>';
    } else if (f.kind === 'map') {
      btn = '<button class="pick" data-pick="map" data-field="' + f.name + '">📋</button>';
      nm = '<span class="nm" id="anm-' + f.name + '">' + (v ? Quest.mapName(v) : '') + '</span>';
    } else if (f.kind === 'enum') {
      btn = '<button class="pick" data-pick="enum" data-enumkey="' + f.enum + '" data-field="' + f.name + '">📋</button>';
      nm = '<span class="hintv" id="anm-' + f.name + '">' + Quest.enumName(f.enum, v) + '</span>';
    } else {
      nm = '<span class="hintv" id="anm-' + f.name + '">' + (f.hint || '') + '</span>';
    }
    return '<div class="frow f"><label>' + f.name + '</label>' +
      '<input data-afield="' + f.name + '" value="' + disp + '"' + numAttrs(f) + ' />' +
      (btn || '<span class="nobtn"></span>') + nm + '</div>';
  }).join('');

  var empty = findEmptySlots();
  $('sheet').innerHTML =
    '<h2>➕ 添加任务</h2>' +
    '<div class="frow" style="border-bottom:1px solid var(--line)">' +
      '<label>空槽位</label>' +
      '<input type="number" id="addSlot" value="' + (slot + 1) + '" min="1" max="' + STRUCT.TASK_COUNT + '" />' +
      '<button class="pick" id="pickSlot">📋</button>' +
      '<span class="hintv" style="min-width:110px">第几个（1~' + STRUCT.TASK_COUNT + '）· 共 ' + empty.length + ' 个空槽</span>' +
    '</div>' +
    '<div class="sub" id="addSlotAddr">地址 ' +
      (BASE + slot * 0x74).toString(16).toUpperCase() + '</div>' +
    '<div class="hint" style="margin:0 0 12px">📥 <b>已读取该空槽遗留数据</b>，请在此基础上修改。<br>' +
    '🔢 <b>「序号」已自动填当前计数器值 ' + seqDefault + '</b>（游戏获得新怪异任务时也是取用该值），写入成功后会 +1 并写回游戏。<br>' +
    '🏷 <b>「编号」已自动填 ' + idDefault + '</b>（= 700000 + 槽位序号 ' + slot + '），也可手动改。<br>' +
    '💡 改「空槽位」或点 📋 换槽 → 会重新读遗留数据。<br>' +
    '🐉 点怪物 📋 选择 → 自动带等级（怪1用主等级，怪2~5/乱入用副等级）。</div>' +
    (simpleAdd
      ? '<div class="hint" style="margin:0 0 10px">⚡ <b>简洁模式</b>：只显示核心字段。' +
        '点怪物 📋 会<b>自动改对应等级</b>（等级不显示，但已写入）。' +
        '💾 写入时<b>所有 32 个字段都会写</b>（隐藏字段保持默认/遗留值）。</div>'
      : '') +
    '<div class="sec">字段（可改）' +
      '<button id="simToggleAdd" title="切换简洁/完整模式（会记住）" style="float:right;font-size:11px;padding:2px 8px;' +
        'border-radius:6px;border:1px solid var(--line);background:' +
        (simpleAdd ? 'var(--ok)' : '#21262d') + ';color:' +
        (simpleAdd ? '#04110a' : 'var(--sub)') + ';cursor:pointer">' +
        (simpleAdd ? '⚡ 简洁 : 开' : '⚡ 简洁 : 关') + '</button>' +
    '</div>' + rows +
    '<div class="sheet-actions">' +
    '<button id="addSave" style="width:100%">💾 写入该空槽</button>' +
    '<button class="ghost" id="cancel" style="margin-top:8px;width:100%">取消</button>' +
    '</div>';
  showOverlay();
  $('cancel').onclick = function () { hideOverlay(); };
  $('addSave').onclick = function () { saveAdd(parseInt($('addSlot').value, 10) - 1); };
  // 简洁/完整 切换
  var sta = $('simToggleAdd');
  if (sta) sta.onclick = function () {
    setSimpleMode(!isSimpleMode());
    toast(isSimpleMode() ? '✅ 简洁模式已开' : '✅ 完整模式已开', 2000);
    buildAddSheet(_addSlot);   // 立即重绘（保持当前槽）
  };

  // 换槽：手动改"第几个"（1~200），失焦时生效
  $('addSlot').addEventListener('change', function () {
    var s = parseInt($('addSlot').value, 10) - 1;   // 显示 1 起 → 内部 0 起
    if (isNaN(s) || s < 0 || s >= STRUCT.TASK_COUNT) { toast('范围 1~' + STRUCT.TASK_COUNT); return; }
    buildAddSheet(s);
  });
  $('pickSlot').onclick = function () { openSlotPicker(slot); };

  bindPickerRows($('sheet'), 'data-afield', 'anm-');
}

/** 空槽选择器：列出所有空槽，点一个就切过去 */
function openSlotPicker(cur) {
  var slots = findEmptySlots();
  _slotCur = cur;
  $('pkTitle').textContent = '选择空槽（共 ' + slots.length + ' 个）';
  $('pkSearch').value = '';
  $('pkSearch').oninput = function () { renderSlotPicker($('pkSearch').value.trim()); };
  renderSlotPicker('');
  $('picker').classList.add('show');
}
var _slotCur = -1;

/** 通用槽选择器：列出**全部 200 个槽**（含空槽），点一个就回调
   *  opts = { title, cur, withAddr, onPick }
   */
function openAnySlotPicker(opts) {
  opts = opts || {};
  _anyPickCb = opts.onPick || null;
  _anyCur = (typeof opts.cur === 'number') ? opts.cur : -1;
  $('pkTitle').textContent = opts.title || '选择槽位';
  $('pkSearch').value = '';
  $('pkSearch').oninput = function () { renderAnySlotPicker($('pkSearch').value.trim()); };
  renderAnySlotPicker('');
  $('picker').classList.add('show');
}
var _anyPickCb = null, _anyCur = -1;

/** 槽位状态：'空' 或 简要描述（怪/等级）*/
function slotLabel(s) {
  var q = null;
  if (Store.getMode() === 'file') {
    var sl = Store.getSlot(s);
    if (sl) { q = {}; for (var k in sl.fields) q[k] = sl.fields[k]; }
  } else {
    q = ALL.filter(function (x) { return x.index === s; })[0] || null;
  }
  if (!q) return { empty: true, txt: '空' };
  var lv = toSigned(q['等级'] >>> 0, 4);
  var m1 = q['怪1ID'] >>> 0;
  var nm = m1 ? Quest.monName(m1) : '无怪';
  return { empty: false, txt: nm + ' Lv' + lv };
}

function renderAnySlotPicker(kw) {
  injectPickerGridCss();   // 首次调用时注入网格样式（不改 index.html）
  var list = [];
  for (var s = 0; s < STRUCT.TASK_COUNT; s++) list.push(s);
  if (kw) {
    var k = kw.trim().toLowerCase();
    var kwNum = (/^[0-9]+$/.test(k)) ? parseInt(k, 10) : null;
    var kwHex = /^0x[0-9a-f]+$/.test(k) ? parseInt(k, 16) : null;
    list = list.filter(function (s) {
      // 支持：槽号（1起）/ 内部索引 / 编号 / 0x 十六进制
      if (String(s).indexOf(k) >= 0) return true;
      if (kwNum !== null && ((s + 1) === kwNum || (STRUCT.TASK_ID_BASE + s) === kwNum)) return true;
      return false;
    });
  }
  if (!list.length) { $('pkItems').innerHTML = '<div class="it">没有匹配的槽</div>'; return; }
  $('pkItems').innerHTML = '<div class="slotgrid">' + list.map(function (s) {
    var on = (s === _anyCur) ? ' on' : '';
    var lb = slotLabel(s);
    var m1 = 0, lv = 0, name = '';
    if (!lb.empty) {
      var q = null;
      if (Store.getMode() === 'file') {
        var sl = Store.getSlot(s);
        if (sl) q = sl.fields;
      } else {
        q = ALL.filter(function (x) { return x.index === s; })[0] || null;
      }
      if (q) { m1 = q['怪1ID'] >>> 0; lv = toSigned(q['等级'] >>> 0, 4); }
      name = m1 ? Quest.monName(m1) : '无怪';
    }
    var stars = !lb.empty && lv >= 100 ? (lv >= 300 ? '🔴' : '🟡') : '';
    return '<div class="slotcell' + on + '" data-slot="' + s + '">' +
      '<div class="sc-no">' + (s + 1) + '</div>' +
      (lb.empty
        ? '<div class="sc-name" style="opacity:.45">空槽</div>'
        : ('<div class="sc-name">' + (stars ? stars + ' ' : '') + escapeHtml(name) + '</div>' +
           '<div class="sc-lv">Lv' + lv + '</div>')) +
      '<div class="sc-id">' + (lb.empty ? '—' : (STRUCT.TASK_ID_BASE + s)) + '</div>' +
      '</div>';
  }).join('') + '</div>';
  $('pkItems').querySelectorAll('.slotcell').forEach(function (el) {
    el.onclick = function () {
      var s = parseInt(el.dataset.slot, 10);
      $('picker').classList.remove('show');
      if (_anyPickCb) _anyPickCb(s);
    };
  });
}

/** 极简 HTML 转义（怪名可能有特殊字符） */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&#34;', "'": '&#39;' }[c];
  });
}

function renderSlotPicker(kw) {
  injectPickerGridCss();   // 网格样式
  var slots = findEmptySlots();
  // 搜索：既支持"第几个"(1起)，也支持内部索引(0起) / 编号 / 模糊数字
  if (kw) {
    var k = kw.trim().toLowerCase();
    var kwNum = (/^[0-9]+$/.test(k)) ? parseInt(k, 10) : null;
    slots = slots.filter(function (s) {
      if (String(s).indexOf(k) >= 0) return true;
      if (kwNum !== null && ((s + 1) === kwNum || (STRUCT.TASK_ID_BASE + s) === kwNum)) return true;
      return false;
    });
  }
  if (!slots.length) { $('pkItems').innerHTML = '<div class="it">没有空槽</div>'; return; }
  $('pkItems').innerHTML = '<div class="slotgrid">' + slots.map(function (s) {
    var on = (s === _slotCur) ? ' on' : '';
    return '<div class="slotcell' + on + '" data-slot="' + s + '">' +
      '<div class="sc-no">' + (s + 1) + '</div>' +
      '<div class="sc-name" style="opacity:.45">空槽</div>' +
      '<div class="sc-id">' + (STRUCT.TASK_ID_BASE + s) + '</div>' +
      '</div>';
  }).join('') + '</div>';
  $('pkItems').querySelectorAll('.slotcell').forEach(function (el) {
    el.onclick = function () {
      var s = parseInt(el.dataset.slot, 10);
      $('picker').classList.remove('show');
      buildAddSheet(s);
    };
  });
}

/** 找一个未被使用的编号（700000 起）
 *  备注：实测规律是"编号 == 700000 + 槽索引"，所以添加任务时通常直接用
 *        STRUCT.TASK_ID_BASE + slot 即可；本函数保留作后备（如规律有例外时）。 */
function nextFreeId() {
  var used = {};
  for (var i = 0; i < ALL.length; i++) used[ALL[i]['编号']] = true;
  for (var n = STRUCT.TASK_ID_BASE; n <= STRUCT.TASK_ID_BASE + STRUCT.TASK_COUNT; n++) {
    if (!used[n]) return n;
  }
  return STRUCT.TASK_ID_BASE;
}

var _addSlot = -1;

async function saveAdd(slot) {
  // 校验：目标槽必须是"空槽"（避免覆盖已有任务）
  if (isNaN(slot) || slot < 0 || slot >= STRUCT.TASK_COUNT) {
    toast('❌ 槽位必须在 1~' + STRUCT.TASK_COUNT + ' 之间', 4500);
    return;
  }
  var used = {};
  for (var u = 0; u < ALL.length; u++) used[ALL[u].index] = true;
  if (used[slot]) {
    toast('❌ 第 ' + (slot + 1) + ' 个槽已被占用（不是空槽），请换一个', 4500);
    return;
  }

  // ✅ 全字段都写：可见字段读输入框，隐藏字段（简洁模式）读 _addFieldVals 缓存
  var changes = [], vmap = {};
  FIELDS.forEach(function (f) {
    var inp = $('sheet').querySelector('input[data-afield="' + f.name + '"]');
    var v;
    if (inp) {
      v = inp.value;                                    // 可见字段
    } else if (_addFieldVals[f.name] !== undefined) {
      v = _addFieldVals[f.name];                        // 隐藏字段：缓存
    } else {
      v = 0;
    }
    var val = clampFieldVal(f, v);   // ← 夹到字段范围
    vmap[f.name] = val;
    changes.push({ off: f.off, size: f.size, value: val });
  });

  // 校验：编号必填 + 不重复
  var num = vmap['编号'] || 0;
  if (num < STRUCT.TASK_ID_BASE || num > STRUCT.TASK_ID_BASE + STRUCT.TASK_COUNT) {
    toast('❌ 编号必须是 ' + STRUCT.TASK_ID_BASE + ' ~ ' + (STRUCT.TASK_ID_BASE + STRUCT.TASK_COUNT) + ' 之间', 4500);
    return;
  }
  var dup = ALL.filter(function (x) { return x['编号'] === num; })[0];
  if (dup) { toast('❌ 编号 ' + num + ' 已存在（第 ' + (dup.index + 1) + ' 个）', 4500); return; }

  var btn = $('addSave');
  busy(btn, true, '⏳ 写入中…');
  try {
    if (Store.getMode() === 'file') {
      // 文件模式：本地写（把空槽变成有效任务）
      Store.setSlotFields(slot, changes);
      await bumpSeqCounter();   // 🔢 计数器 +1（只改本地）
      toast('✅ 已添加到文件（第 ' + (slot + 1) + ' 个，编号 ' + num + '）序号已 +1', 3000);
      busy(btn, false);
      hideOverlay();
      refreshFromStore();
      return;
    }
    if (!BASE) BASE = await Quest.questBase();
    var r = await Quest.setQuestFields(BASE, slot, changes);
    if (r.ok) {
      await bumpSeqCounter();   // 🔢 计数器 +1（在线：写回 Switch）
      toast('✅ 已写入第 ' + (slot + 1) + ' 个槽（编号 ' + num + '）序号已 +1', 3000);
    } else toast('⚠️ 写入后校验不一致，请检查', 4000);
  } catch (e) {
    toast('❌ 写入失败：' + e.message, 4000);
  }
  busy(btn, false);
  hideOverlay();
  load();
}

/** 🔢 序号计数器 +1（在线写回 Switch；文件模式只改本地） */
async function bumpSeqCounter() {
  var cur = Store.getSeqCounter();
  if (cur === null || cur === undefined) return;
  var next = (cur + 1) >>> 0;
  if (Store.getMode() === 'file') {
    Store.setSeqCounter(next);          // 只改本地（导出文件里带上）
    updateSeqStat();
    return;
  }
  try {
    var ok = await Quest.writeSeqCounter(next);   // 写回 Switch
    Store.setSeqCounter(ok ? next : cur);
    updateSeqStat();
  } catch (e) { /* 写失败就保持原值 */ }
}

// ---------- 导出 / 导入（备份 & 分享）----------

/** 导出当前数据源为 JSON 文件（秒出：数据已在内存里） */
function doExport() {
  if (!Store.getSlots().length) { toast('还没有数据，先加载或打开文件'); return; }
  var name = prompt('文件名（不含扩展名）：', '怪异任务_' + tsName());
  if (!name) return;
  name = name.replace(/[\\/:*?"<>|]/g, '_');
  if (!/\.json$/i.test(name)) name += '.json';

  try {
    var data = Store.toExport();
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('✅ 已导出 ' + data.quests.length + ' 个槽 → ' + name, 3500);
  } catch (e) {
    toast('❌ 导出失败：' + e.message, 4000);
  }
}

function tsName() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
    p(d.getHours()) + p(d.getMinutes());
}

/** 上传到游戏：把当前数据（含文件编辑的）写进 Switch 内存 */
async function doWriteBack() {
  if (_busy) return;
  var slots = Store.getSlots();
  if (!slots.length) { toast('没有数据'); return; }

  // ⚠️ 上传只看"Switch 是否连上"，与数据来源（文件/在线）无关
  //    （以前这里错误地检查 Store.getMode()==='file' 就拦住，导致"打开了文件就传不回去"）
  try {
    var st = await Bridge.status();
    if (!st.connected) {
      toast('⚠️ 没连上 Switch。请确认：中转已启动 + 游戏已开 + 设置里的地址正确');
      return;
    }
  } catch (e) {
    toast('⚠️ 连不上中转：' + e.message + '（请先启动中转服务）', 4500);
    return;
  }

  if (!confirm('把当前 ' + slots.length + ' 个任务全部上传到游戏吗？\n\n⚠️ 会覆盖游戏里的任务！\n（大块写入，约 1~3 秒）')) return;
  setBusy(true);
  var btn = $('writeBackBtn');
  busy(btn, true, '⏳ 上传中…');
  var pb = $('progressbar'); pb.classList.add('show');
  pb.querySelector('.pbar-txt').textContent = '大块写入中…';
  pb.querySelector('.pbar-fill').style.width = '30%';
  try {
    BASE = await Quest.questBase();   // 上传必须重新定位（ASLR）
    if (!BASE) throw new Error('定位任务数组失败（游戏没开？）');
    var ok = await Quest.writeAllRaw(slots, function (c, t) {});
    pb.querySelector('.pbar-fill').style.width = '100%';
    pb.classList.remove('show');
    toast('✅ 已上传 ' + ok + ' 个任务到游戏', 3500);
  } catch (e) {
    pb.classList.remove('show');
    toast('❌ 上传失败：' + e.message, 4000);
  }
  busy(btn, false);
  setBusy(false);
  // 上传后：按当前数据源刷新（file 模式保持文件数据，不强行读回游戏）
  if (Store.getMode() === 'online') load();
  else refreshFromStore();
}

// 给"字段行"统一绑定 📋 选择器（前缀用于区分单任务编辑/添加）
function bindPickerRows(root, inputAttr, nmPrefix) {
  var isAdd = (nmPrefix === 'anm-');   // 添加任务面板
  var cache = isAdd ? _addFieldVals : _fieldVals;

  // 统一写值：有输入框就写框 + 缓存，没框（简洁模式隐藏字段）就只写缓存
  function setVal(fname, val) {
    cache[fname] = val;
    var inp = root.querySelector('input[' + inputAttr + '="' + fname + '"]');
    if (inp) { inp.value = val; flashEl(inp); }
    var nm = $(nmPrefix + fname);
    if (nm) {
      var ff = Quest.fieldByName(fname);
      if (ff && ff.kind === 'mon') nm.textContent = Quest.monName(val);
      else if (ff && ff.kind === 'map') nm.textContent = Quest.mapName(val);
      else if (ff && ff.kind === 'enum') nm.textContent = Quest.enumName(ff.enum, val);
    }
  }

  root.querySelectorAll('[data-pick]').forEach(function (b) {
    b.onclick = function () {
      var field = b.dataset.field, kind = b.dataset.pick;
      var f = Quest.fieldByName(field);
      if (kind === 'enum') {
        openEnumPicker(f.enum, function (val) { setVal(field, val); });
        return;
      }
      openPicker(kind, function (id) {
        setVal(field, id);
        // 【联动】选怪自动带等级（怪1 用主等级，怪2~5/乱入 用副等级）
        if (kind === 'mon') {
          var lv = MON_LEVELS[id];
          if (f && f.linked && lv) {
            var role = (f.slot === 1) ? 0 : 1;
            setVal(f.linked, lv[role]);
            var hasBox = !!root.querySelector('input[' + inputAttr + '="' + f.linked + '"]');
            var nmon = Quest.monName(id);
            if (lv[0] === 0 && lv[1] === 0) {
              toast('⚠️ ' + nmon + ' 无怪异等级，' + f.linked + ' 填 0', 2500);
            } else {
              toast('✅ ' + nmon + ' → ' + f.linked + ' = ' + lv[role] +
                (hasBox ? '' : '（已自动写入，可在完整模式查看）'), 2500);
            }
          }
        }
      });
    };
  });
  // 手改数值时同步缓存 + 刷新枚举名提示
  root.querySelectorAll('input[' + inputAttr + ']').forEach(function (inp) {
    inp.addEventListener('input', function () {
      var fname = inp.getAttribute(inputAttr);
      cache[fname] = inp.value;              // ← 同步到缓存
      var f = Quest.fieldByName(fname);
      var nm = $(nmPrefix + (f ? f.name : ''));
      if (!nm || !f || f.kind !== 'enum') return;
      nm.textContent = Quest.enumName(f.enum, parseInt(inp.value, 10) || 0);
    });
  });
}

// ---------- 选择器（怪物 / 地图 / 枚举）----------

var _pkCb = null, _pkKind = null, _pkEnumKey = null;

function openPicker(kind, cb) {
  _pkKind = kind; _pkCb = cb; _pkEnumKey = null;
  $('pkTitle').textContent = (kind === 'mon') ? '选择怪物' : '选择地图';
  $('pkSearch').value = '';
  renderPicker('');
  $('picker').classList.add('show');
  $('pkSearch').oninput = function () { renderPicker($('pkSearch').value.trim()); };
  // 不自动聚焦（避免弹键盘）
}
function openEnumPicker(enumKey, cb) {
  _pkKind = 'enum'; _pkCb = cb; _pkEnumKey = enumKey;
  $('pkTitle').textContent = '选择「' + enumKey + '」';
  $('pkSearch').value = '';
  renderPicker('');
  $('picker').classList.add('show');
  $('pkSearch').oninput = function () { renderPicker($('pkSearch').value.trim()); };
  // 不自动聚焦（避免弹键盘）
}
function renderPicker(kw) {
  injectPickerGridCss();   // 确保网格样式已注入
  var html = '';
  if (_pkKind === 'enum') {
    // ---- 枚举：2 列格子 ----
    var en = ENUMS[_pkEnumKey] || {};
    var list = Object.keys(en).map(function (k) { return { id: k, name: en[k] }; });
    if (kw) { list = filterByIdName(list, kw); }
    html = '<div class="itemgrid enum2">' + list.map(function (o) {
      return '<div class="itemcell" data-id="' + o.id + '">' +
        '<div class="ic-name">' + escapeHtml(o.name) + '</div>' +
        '<div class="ic-id">' + o.id + '</div>' +
        '</div>';
    }).join('') + '</div>';
  } else {
    // ---- 怪物 / 地图：2 列格子 ----
    var table = (_pkKind === 'mon') ? MONSTERS : MAPS;
    var lst = Object.keys(table).map(function (k) { return { id: k, name: table[k] }; });
    if (kw) { lst = filterByIdName(lst, kw); }
    lst.sort(function (a, b) { return (+a.id) - (+b.id); });
    // "无 (0)" 只在没搜索时显示（搜索时避免干扰）
    var cells = '';
    if (!kw) {
      cells += '<div class="itemcell itemcell-none" data-id="0">' +
        '<div class="ic-name" style="opacity:.6">— 无 —</div>' +
        '<div class="ic-id">0</div></div>';
    }
    cells += lst.map(function (o) {
      var lv = (_pkKind === 'mon') ? MON_LEVELS[o.id] : null;
      var lvTxt = (lv && (lv[0] || lv[1])) ? ('主' + lv[0] + '/副' + lv[1]) : '';
      return '<div class="itemcell" data-id="' + o.id + '">' +
        '<div class="ic-name">' + escapeHtml(o.name) + '</div>' +
        '<div class="ic-sub">' + (lvTxt ? (lvTxt + ' · ') : '') +
          '0x' + (+o.id).toString(16).toUpperCase() + '</div>' +
        '</div>';
    }).join('');
    html = '<div class="itemgrid">' + cells + '</div>';
    if (!lst.length) html = '<div class="it">没有匹配的结果</div>';
  }
  $('pkItems').innerHTML = html;
  $('pkItems').querySelectorAll('.itemcell').forEach(function (el) {
    el.onclick = function () {
      var id = parseInt(el.dataset.id, 10);
      if (_pkCb) _pkCb(id);
      $('picker').classList.remove('show');
    };
  });
}

/** 选择器搜索：支持「名字」/「十进制ID」/「0x十六进制ID」 */
function filterByIdName(list, kw) {
  var k = kw.trim().toLowerCase();
  if (!k) return list;
  // 如果输入像 0x 开头的十六进制，或纯数字，就按数值匹配
  var num = null;
  if (/^0x[0-9a-f]+$/.test(k)) num = parseInt(k, 16);
  else if (/^[0-9]+$/.test(k)) num = parseInt(k, 10);

  return list.filter(function (o) {
    // 名字匹配
    if (o.name.toLowerCase().indexOf(k) >= 0) return true;
    // ID 匹配（十进制字符串 / 十六进制字符串都试）
    var idn = +o.id;
    var idHex = idn.toString(16).toLowerCase();
    if (String(o.id).indexOf(k) >= 0) return true;
    if (idHex.indexOf(k) >= 0) return true;
    if (num !== null && idn === num) return true;
    return false;
  });
}

// ---------- 版本号 & 更新 ----------

/** 显示版本号；点击 = 检查更新（重新拉取页面 / 让 Service Worker 刷新）*/
function initVersion() {
  var el = $('verEl');
  if (!el) return;
  var cur = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : 'v?';
  el.textContent = cur;
  el.title = '当前 ' + cur + '（点击检查更新）';

  el.onclick = function () {
    el.textContent = '检查中…';
    checkUpdate().then(function (r) {
      if (r.updated) {
        el.textContent = '🔄 更新中…';
        // 稍等一下让用户看到，再刷新
        setTimeout(function () { doReload(); }, 500);
      } else {
        el.textContent = cur;
        if (r.msg) toast(r.msg, 3000);
      }
    }).catch(function () {
      el.textContent = cur;
      doReload();
    });
  };
}

/** 检查更新：
 *  ① 问一遍 index.html（拿最新内联版本，比对 APP_VERSION）
 *  ② 不等结果也能强刷 —— 用户手动点就是要更新
 */
async function checkUpdate() {
  try {
    var base = Bridge.getBase().replace(/\/+$/, '');
    var r = await fetch(base + '/?_t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return { updated: true, msg: '' };
    var html = await r.text();
    // 从页面里抓 APP_VERSION
    var m = html.match(/var\s+APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    var cur = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '';
    if (m && m[1] && cur && m[1] !== cur) {
      return { updated: true, msg: '发现新版本 ' + m[1] };
    }
  } catch (e) { /* 拉不到就直接刷新 */ }
  // 没发现版本变化，也提示一下（并允许顺手刷新）
  return { updated: false, msg: '已是最新（' + ((typeof APP_VERSION !== 'undefined') ? APP_VERSION : '?') + '）' };
}

/** 强制刷新：清 SW 缓存后 reload */
function doReload() {
  var done = false;
  function go() { if (!done) { done = true; location.reload(); } }
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      // 通知 SW 清缓存，然后刷新
      navigator.serviceWorker.controller.postMessage({ type: 'skip-waiting-clear' });
      setTimeout(go, 300);
      return;
    }
  } catch (e) { /* ignore */ }
  go();
}

<!-- ===== PWA：Service Worker 注册（失败不影响使用）===== -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;

  // 记录状态，方便页面上显示
  window.__pwa = { sw: 'unsupported' };

  // SW 仅在 https / localhost 生效；http://192.168.x.x 会被浏览器拒绝
  var secure = (location.protocol === 'https:') ||
               (location.hostname === 'localhost') ||
               (location.hostname === '127.0.0.1');

  if (!secure) {
    window.__pwa.sw = 'insecure';
    console.info('[PWA] 非 HTTPS/localhost，浏览器会跳过 Service Worker（不影响使用）。');
    return;
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      window.__pwa.sw = 'ok';
      console.info('[PWA] Service Worker 已注册：', reg.scope);
    }).catch(function (err) {
      window.__pwa.sw = 'error';
      console.warn('[PWA] Service Worker 注册失败：', err);
    });
  });
})();
</script>
